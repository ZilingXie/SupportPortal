<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engineer Portal / 工单分配追踪计划</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667789;
      --line: #d9e2ec;
      --accent: #1d5d8f;
      --accent-soft: #e5eef7;
      --done: #1f7a4d;
      --done-soft: #e0f4e8;
      --blocked: #a33d35;
      --blocked-soft: #fde7e4;
      --shadow: 0 10px 26px rgba(23, 32, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 7px 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    header {
      background: #19324a;
      color: #f8fafc;
      padding: 30px 24px;
    }

    .header-inner,
    main {
      max-width: 1160px;
      margin: 0 auto;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 34px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 860px;
      margin-bottom: 0;
      color: #dce8f4;
    }

    main {
      padding: 22px 18px 42px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1.4fr repeat(4, minmax(110px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .tile,
    .task,
    .toolbar,
    .phase {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .tile {
      padding: 14px;
      min-height: 88px;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .number {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .progress-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .bar {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #e6edf4;
    }

    .bar span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 22px rgba(23, 32, 42, 0.08);
    }

    .search {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .phase {
      margin-bottom: 14px;
      overflow: hidden;
    }

    .phase-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .phase-head h2 {
      margin-bottom: 4px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .phase-head p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .phase-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .tasks {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .task {
      display: grid;
      grid-template-columns: minmax(260px, 0.95fr) minmax(320px, 1.2fr);
      gap: 14px;
      padding: 14px;
      box-shadow: none;
    }

    .task.done {
      border-color: rgba(31, 122, 77, 0.45);
      background: #fbfffc;
    }

    .task.blocked {
      border-color: rgba(163, 61, 53, 0.42);
      background: #fffafa;
    }

    .task h3 {
      margin-bottom: 7px;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .task p {
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 14px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      margin-right: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .controls {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .control-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .control-row label {
      color: var(--muted);
      font-size: 13px;
    }

    select {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 6px 8px;
    }

    .task-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .task-progress .bar {
      height: 8px;
    }

    .checks {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .checks label {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      color: #26343d;
      font-size: 14px;
    }

    .checks input {
      margin-top: 3px;
      accent-color: var(--accent);
    }

    .empty {
      display: none;
      padding: 24px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    .foot {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .summary,
      .toolbar,
      .task {
        grid-template-columns: 1fr;
      }

      .toolbar {
        position: static;
      }
    }

    @media (max-width: 620px) {
      header {
        padding: 24px 16px;
      }

      main {
        padding: 16px 12px 32px;
      }

      .phase-head {
        display: block;
      }

      .phase-count {
        display: block;
        margin-top: 8px;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .toolbar,
      .foot {
        display: none;
      }

      .tile,
      .task,
      .phase {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Engineer Portal / 工单分配追踪计划</h1>
      <p class="subtitle">目标是先解决由 Client AI 创建的 Engineer 工单流转、UTC+8 shift 排班、shift 内分配、单 case 处理、3 小时 SLA、超时转派和过程审计；Engineer AI 调查与批准回复沿用现有 Engineer 端闭环。</p>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="进度概览">
      <div class="tile">
        <div class="progress-line">
          <span>整体完成度</span>
          <strong id="overallText">0%</strong>
        </div>
        <div class="bar"><span id="overallBar"></span></div>
      </div>
      <div class="tile">
        <span class="label">任务</span>
        <strong class="number" id="taskCount">0</strong>
      </div>
      <div class="tile">
        <span class="label">进行中</span>
        <strong class="number" id="doingCount">0</strong>
      </div>
      <div class="tile">
        <span class="label">已完成</span>
        <strong class="number" id="doneCount">0</strong>
      </div>
      <div class="tile">
        <span class="label">阻塞</span>
        <strong class="number" id="blockedCount">0</strong>
      </div>
    </section>

    <section class="toolbar" aria-label="筛选工具">
      <input class="search" id="searchInput" type="search" placeholder="搜索任务、阶段、验收点">
      <div class="chips" id="phaseFilters"></div>
      <div class="chips" id="statusFilters"></div>
    </section>

    <div id="board"></div>
    <div class="empty" id="empty">没有匹配的任务。</div>
    <p class="foot">勾选项和状态会自动保存在当前浏览器本地；需要重新开始时可用“重置进度”。</p>
  </main>

  <script>
    const STORAGE_KEY = "supportportal_engineer_portal_assignment_plan_v1";

    const STATUS = {
      todo: "未开始",
      doing: "进行中",
      blocked: "阻塞",
      done: "已完成"
    };

    const PHASES = [
      {
        id: "model",
        title: "一、分配模型",
        goal: "先把 Engineer 工单定义、shift 排班、分配资格、单 case 分配和优先级策略定义清楚。"
      },
      {
        id: "sla",
        title: "二、SLA 与转派",
        goal: "用内部 SLA 和超时转派替代人工追问，让过程可以被系统追踪。"
      },
      {
        id: "portal",
        title: "三、Portal 操作台",
        goal: "提供登录、排班维护、当前工单处理、AI 草稿批准和客户回复发送的最小工作台。"
      },
      {
        id: "pilot",
        title: "四、试运行与数据",
        goal: "用小范围试点验证处理效率、超时情况和质量判断。"
      }
    ];

    const TASKS = [
      {
        id: "ticket-lifecycle",
        phase: "model",
        module: "模型",
        title: "定义 Engineer 工单生命周期",
        text: "Engineer 工单由 Client AI 为一个客户问题创建；进入队列后等待分配，工程师与 Engineer AI 协作，批准面向客户的回复后关闭。",
        checks: [
          "明确 Engineer 工单不同于客户端 ticket，每个 Engineer 工单只对应一个问题。",
          "明确进入队列、已分配、处理中、待批准回复、已回复客户、已关闭这些状态。",
          "同一客户 ticket 后续提出新问题时创建新的 Engineer 工单。"
        ]
      },
      {
        id: "shift-schedule",
        phase: "model",
        module: "排班",
        title: "设计 UTC+8 shift schedule",
        text: "工程师需要有手动配置的 shift schedule，系统只在 UTC+8 shift 时间内把工单分配给该工程师。",
        checks: [
          "shift schedule 使用 UTC+8 作为统一时区。",
          "工程师可以在 Engineer Portal 登录后查看和修改自己的 shift。",
          "分配逻辑能判断当前时间是否落在工程师 shift 内。"
        ]
      },
      {
        id: "availability",
        phase: "model",
        module: "在线状态",
        title: "定义登录与分配资格",
        text: "工程师登录后才进入 Engineer Portal；登录但不在 shift 内仍不能被分配新 Engineer 工单。",
        checks: [
          "工程师必须登录后才可进入处理工作台。",
          "登录状态和当前 UTC+8 shift 同时满足时才可被分配。",
          "不在 shift 内的工程师不能收到新分配，即使已经登录。"
        ]
      },
      {
        id: "single-case",
        phase: "model",
        module: "分配",
        title: "设计单 case 分配规则",
        text: "工程师每次只处理一个 Engineer 工单；当前工单完成并回复客户后，系统才会分配下一个。",
        checks: [
          "同一工程师同一时间不会并行分配多个 active Engineer 工单。",
          "批准回复并发送给客户后才进入下一轮分配。",
          "队列中 case 有稳定排序规则。"
        ]
      },
      {
        id: "priority-policy",
        phase: "model",
        module: "优先级",
        title: "定义 first response 与 regular response 优先级",
        text: "让系统决定先处理哪类 case，而不是让人手动在队列里挑。",
        checks: [
          "first response 优先级高于 regular response。",
          "同类 case 按等待时间排序。",
          "特殊高风险 case 可进入人工指定通道。"
        ]
      },
      {
        id: "internal-sla",
        phase: "sla",
        module: "SLA",
        title: "定义内部处理 SLA",
        text: "每个 Engineer 工单从成功 assign 给工程师开始计 3 小时，工程师和 Engineer AI 需要在 SLA 内产出并批准面向客户的回复。",
        checks: [
          "SLA 起点是分配成功时间，不是工单创建时间。",
          "默认 SLA 时长为 3 小时。",
          "工程师批准回复并发送给客户后停止计时。"
        ]
      },
      {
        id: "timeout-transfer",
        phase: "sla",
        module: "转派",
        title: "设计超时转派",
        text: "超过 3 小时未完成客户回复时，系统先标记原工程师超时，再把 Engineer 工单转给下一个符合登录和 shift 条件的工程师。",
        checks: [
          "超时能被自动识别并关联到当前负责工程师。",
          "转派后能看到前后处理链路。",
          "无人满足登录和 shift 条件时进入等待队列。"
        ]
      },
      {
        id: "handover-rule",
        phase: "sla",
        module: "交接",
        title: "定义下班和未完成 case 的处理",
        text: "shift 结束前未完成的 Engineer 工单需要进入明确处理：完成回复、提交转派原因，或由系统按超时/下班规则重新分配。",
        checks: [
          "shift 结束后工程师不能再收到新分配。",
          "当前工单无法完成时必须提交升级或转派原因。",
          "转派事件保留原工程师已提供的信息和 Engineer AI 上下文。"
        ]
      },
      {
        id: "audit-events",
        phase: "sla",
        module: "审计",
        title: "记录关键事件",
        text: "系统要记录创建、入队、分配、SLA 开始、接手、AI 草稿、批准回复、发送客户、超时、转派和关闭这些事件。",
        checks: [
          "每个 Engineer 工单创建和分配都有事件记录。",
          "每次状态变化都有事件记录。",
          "能按 Engineer 工单还原完整处理链路和 SLA 责任人。"
        ]
      },
      {
        id: "portal-workspace",
        phase: "portal",
        module: "工作台",
        title: "设计最小处理页面",
        text: "页面只服务当前 Engineer 工单：看客户问题、看 Engineer AI 建议、补充调查信息、批准或要求修改客户回复。",
        checks: [
          "当前 Engineer 工单是页面主信息。",
          "Engineer AI 生成 Draft Customer Reply 后展示给工程师批准。",
          "没有同时处理多个 Engineer 工单的入口。"
        ]
      },
      {
        id: "portal-login-shift",
        phase: "portal",
        module: "登录与排班",
        title: "设计登录与 shift 维护页面",
        text: "Engineer Portal 需要登录界面；登录后工程师可以维护自己的 UTC+8 shift schedule，并看到当前是否可接单。",
        checks: [
          "登录态决定是否能进入 Engineer Portal。",
          "shift 编辑入口清楚可见。",
          "页面明确展示当前是否在 shift 内、是否可被分配。"
        ]
      },
      {
        id: "assignment-ui-prototype",
        phase: "portal",
        module: "/assignment",
        title: "完成独立 Assignment UI 原型",
        text: "新增独立 /assignment 页面作为前端 mock 原型，不修改现有 /engineer；页面覆盖工程师选择器、每日固定 UTC+8 shift、分配资格、单 active Engineer 工单、assign 后 3 小时 SLA 倒计时和超时转派模拟。",
        status: "done",
        completedChecks: true,
        checks: [
          "登录区使用 Jack、Maya、Leo 工程师选择器，并用 localStorage 保存当前工程师。",
          "shift 支持每日固定 start/end time 编辑，统一 UTC+8，并展示 In shift / Out of shift。",
          "只有登录且在 shift 内、且没有 active Engineer Ticket 时，才显示 Eligible for assignment。",
          "mock ticket 从 queue 分配到当前工程师后开始 3 小时 SLA 倒计时。",
          "工程师批准并发送 Engineer AI 生成的客户回复后关闭当前 Engineer Ticket，并允许领取下一个。",
          "SLA 超时后展示 timeout / transfer 状态，模拟标记原工程师超时并转派。"
        ]
      },
      {
        id: "portal-queue-view",
        phase: "portal",
        module: "队列",
        title: "设计队列与运行视图",
        text: "用于看当前 Engineer 工单队列、登录且在 shift 内的人数、处理中工单、SLA 剩余时间、超时工程师和已转派工单。",
        checks: [
          "能看到等待队列长度。",
          "能看到处理中 Engineer 工单数。",
          "能看到即将超时、已超时和已转派工单。"
        ]
      },
      {
        id: "zendesk-source",
        phase: "portal",
        module: "Zendesk",
        title: "定义 Zendesk 中转关系",
        text: "客户端 ticket 仍是客户会话的 source of truth；Engineer 工单由 Client AI 为单个问题创建，Engineer Portal 负责分配、处理和回写客户回复。",
        checks: [
          "Client AI 创建的新 Engineer 工单能进入 Portal 队列。",
          "工程师批准的客户回复能按现有 Engineer 端闭环发送给客户。",
          "客户端 ticket 后续新问题会创建新的 Engineer 工单。"
        ]
      },
      {
        id: "response-quality-check",
        phase: "portal",
        module: "质量",
        title: "定义客户回复批准标准",
        text: "Engineer AI 生成客户回复草稿，工程师批准后才发送给客户并关闭 Engineer 工单；无效回复不能通过批准。",
        checks: [
          "批准前必须存在 Draft Customer Reply。",
          "回复必须包含结论、证据或明确下一步。",
          "重复索要已知信息会被标记。",
          "纯礼貌回复不能算完成，也不能关闭 Engineer 工单。"
        ]
      },
      {
        id: "pilot-split",
        phase: "pilot",
        module: "试点",
        title: "设计小范围试点方式",
        text: "先让少数 Tier One 人员进入 Portal，其余保持原流程，用真实 case 对比效果。",
        checks: [
          "试点 case 来源清楚。",
          "旧流程与新流程可以对比。",
          "试点失败时能回到原流程。"
        ]
      },
      {
        id: "metrics",
        phase: "pilot",
        module: "指标",
        title: "定义试运行指标",
        text: "核心看处理量、等待时间、assign 后 3 小时 SLA、超时工程师、转派、有效回复比例和客户继续追问情况。",
        checks: [
          "能统计处理量。",
          "能统计从 assign 到客户回复发送的平均处理时间和超时次数。",
          "能统计转派和升级人工原因。"
        ]
      },
      {
        id: "rollout-decision",
        phase: "pilot",
        module: "复盘",
        title: "形成扩大或收口决策",
        text: "试点后判断是否扩大到更多人、是否调整 SLA、是否开始接入 Engineer AI 调查能力。",
        checks: [
          "有试点结果摘要。",
          "有主要问题清单。",
          "有下一步扩大或收口结论。"
        ]
      }
    ];

    let state = {
      statuses: {},
      checks: {},
      filters: {
        phase: "all",
        status: "all",
        query: ""
      }
    };

    const board = document.getElementById("board");
    const empty = document.getElementById("empty");
    const searchInput = document.getElementById("searchInput");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        state.statuses = saved.statuses || {};
        state.checks = saved.checks || {};
      } catch {
        state.statuses = {};
        state.checks = {};
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        statuses: state.statuses,
        checks: state.checks
      }));
    }

    function getStatus(task) {
      return state.statuses[task.id] || task.status || "todo";
    }

    function isChecked(taskId, index) {
      const key = `${taskId}:${index}`;
      if (Object.prototype.hasOwnProperty.call(state.checks, key)) {
        return Boolean(state.checks[key]);
      }
      const task = TASKS.find((item) => item.id === taskId);
      return Boolean(task && task.completedChecks && getStatus(task) === "done");
    }

    function setChecked(taskId, index, checked) {
      state.checks[`${taskId}:${index}`] = checked;
      saveState();
      render();
    }

    function setStatus(taskId, status) {
      state.statuses[taskId] = status;
      saveState();
      render();
    }

    function taskCompletion(task) {
      if (getStatus(task) === "done") return 100;
      if (!task.checks.length) return getStatus(task) === "done" ? 100 : 0;
      const done = task.checks.filter((_, index) => isChecked(task.id, index)).length;
      return Math.round((done / task.checks.length) * 100);
    }

    function effectiveCompletion(task) {
      return getStatus(task) === "done" ? 100 : taskCompletion(task);
    }

    function taskMatches(task) {
      const phaseOk = state.filters.phase === "all" || task.phase === state.filters.phase;
      const statusOk = state.filters.status === "all" || getStatus(task) === state.filters.status;
      const q = state.filters.query.trim().toLowerCase();
      const text = [task.module, task.title, task.text, ...task.checks].join(" ").toLowerCase();
      return phaseOk && statusOk && (!q || text.includes(q));
    }

    function renderFilters() {
      const phaseFilters = document.getElementById("phaseFilters");
      const statusFilters = document.getElementById("statusFilters");
      phaseFilters.innerHTML = "";
      statusFilters.innerHTML = "";
      [{ id: "all", title: "全部阶段" }, ...PHASES].forEach((phase) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `chip${state.filters.phase === phase.id ? " active" : ""}`;
        button.textContent = phase.title.replace(/^[一二三四]、/, "");
        button.addEventListener("click", () => {
          state.filters.phase = phase.id;
          render();
        });
        phaseFilters.appendChild(button);
      });
      [{ id: "all", label: "全部状态" }, ...Object.entries(STATUS).map(([id, label]) => ({ id, label }))].forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `chip${state.filters.status === item.id ? " active" : ""}`;
        button.textContent = item.label;
        button.addEventListener("click", () => {
          state.filters.status = item.id;
          render();
        });
        statusFilters.appendChild(button);
      });
    }

    function renderTask(task) {
      const completion = taskCompletion(task);
      const status = getStatus(task);
      const article = document.createElement("article");
      article.className = `task ${status}`;
      article.innerHTML = `
        <div>
          <span class="tag">${escapeHtml(task.module)}</span>
          <h3>${escapeHtml(task.title)}</h3>
          <p>${escapeHtml(task.text)}</p>
        </div>
        <div class="controls">
          <div class="control-row">
            <label>状态</label>
            <select data-status="${escapeAttr(task.id)}">
              ${Object.entries(STATUS).map(([value, label]) => `<option value="${value}"${status === value ? " selected" : ""}>${label}</option>`).join("")}
            </select>
          </div>
          <div class="task-progress">
            <span>${completion}%</span>
            <div class="bar"><span style="width: ${completion}%"></span></div>
          </div>
          <ul class="checks">
            ${task.checks.map((check, index) => `
              <li>
                <label>
                  <input type="checkbox" data-check-task="${escapeAttr(task.id)}" data-check-index="${index}"${isChecked(task.id, index) ? " checked" : ""}>
                  <span>${escapeHtml(check)}</span>
                </label>
              </li>
            `).join("")}
          </ul>
        </div>
      `;
      return article;
    }

    function render() {
      renderFilters();
      board.innerHTML = "";
      let visible = 0;
      PHASES.forEach((phase) => {
        const tasks = TASKS.filter((task) => task.phase === phase.id && taskMatches(task));
        if (!tasks.length) return;
        visible += tasks.length;
        const section = document.createElement("section");
        section.className = "phase";
        section.innerHTML = `
          <div class="phase-head">
            <div>
              <h2>${escapeHtml(phase.title)}</h2>
              <p>${escapeHtml(phase.goal)}</p>
            </div>
            <span class="phase-count">${tasks.length} 项</span>
          </div>
          <div class="tasks"></div>
        `;
        const list = section.querySelector(".tasks");
        tasks.forEach((task) => list.appendChild(renderTask(task)));
        board.appendChild(section);
      });
      empty.style.display = visible ? "none" : "block";
      bindControls();
      updateSummary();
    }

    function bindControls() {
      document.querySelectorAll("[data-status]").forEach((select) => {
        select.addEventListener("change", () => setStatus(select.dataset.status, select.value));
      });
      document.querySelectorAll("[data-check-task]").forEach((box) => {
        box.addEventListener("change", () => setChecked(box.dataset.checkTask, box.dataset.checkIndex, box.checked));
      });
    }

    function updateSummary() {
      const total = TASKS.length;
      const done = TASKS.filter((task) => getStatus(task) === "done").length;
      const doing = TASKS.filter((task) => getStatus(task) === "doing").length;
      const blocked = TASKS.filter((task) => getStatus(task) === "blocked").length;
      const overall = Math.round(TASKS.reduce((sum, task) => sum + effectiveCompletion(task), 0) / total);
      document.getElementById("overallText").textContent = `${overall}%`;
      document.getElementById("overallBar").style.width = `${overall}%`;
      document.getElementById("taskCount").textContent = total;
      document.getElementById("doingCount").textContent = doing;
      document.getElementById("doneCount").textContent = done;
      document.getElementById("blockedCount").textContent = blocked;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("\n", " ");
    }

    searchInput.addEventListener("input", () => {
      state.filters.query = searchInput.value;
      render();
    });

    const resetButton = document.createElement("button");
    resetButton.type = "button";
    resetButton.textContent = "重置进度";
    resetButton.addEventListener("click", () => {
      if (!confirm("确认重置本页进度？")) return;
      localStorage.removeItem(STORAGE_KEY);
      state.statuses = {};
      state.checks = {};
      render();
    });
    document.querySelector(".toolbar").appendChild(resetButton);

    loadState();
    render();
  </script>
</body>
</html>
