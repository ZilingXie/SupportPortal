<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SupportPortal | Project Overview</title>
  <meta name="description" content="SupportPortal Phase、Module、Function、Task、PR、Meeting 和架构汇总" />
  <style>
    :root {
      --bg: #fbf4e4;
      --surface: #fff9ee;
      --surface-soft: #f3ead8;
      --surface-tint: #fff2d8;
      --ink: #17130d;
      --muted: #6f675b;
      --line: rgba(23, 19, 13, 0.14);
      --line-strong: rgba(23, 19, 13, 0.24);
      --green: #2f8b57;
      --orange: #d56f2b;
      --blue: #2368a2;
      --violet: #7560b5;
      --red: #b94b38;
      --radius: 9px;
      --shadow: 0 18px 48px rgba(33, 24, 10, 0.1);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #f4d7aa 0%, #fbf4e4 38%, #e9f0d4 100%);
      font-family: var(--sans);
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    .page { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .project-head { background: rgba(255, 249, 238, .9); border-bottom: 1px solid var(--line); padding: 22px 28px 0; }
    .head-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: start; max-width: 1380px; margin: 0 auto; }
    .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { margin-bottom: 0; font: 750 32px/1.2 ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif; letter-spacing: -.02em; }
    h2 { margin-bottom: 8px; font: 720 25px/1.25 ui-serif, "Songti SC", Georgia, serif; }
    h3 { margin-bottom: 7px; font-size: 17px; line-height: 1.35; }
    h4 { margin-bottom: 6px; font-size: 14px; }
    .eyebrow, .section-kicker { color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .eyebrow { margin-bottom: 10px; }
    .status-pill, .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; white-space: nowrap; }
    .status-pill { min-height: 26px; padding: 0 9px; color: #1f6f42; background: rgba(47, 139, 87, .12); border: 1px solid rgba(47, 139, 87, .24); font-size: 12px; font-weight: 700; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .goal-card { margin-top: 18px; max-width: 820px; border: 1px solid rgba(213, 111, 43, .18); border-radius: var(--radius); overflow: hidden; background: var(--surface-tint); }
    .goal-label { min-height: 36px; padding: 9px 14px 0; color: #9f4d16; font-size: 14px; font-weight: 750; }
    .goal-body { padding: 4px 14px 14px; color: #33281c; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
    .head-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 17px 0 19px; color: var(--muted); font-size: 13px; }
    .head-meta span { min-width: 0; overflow-wrap: anywhere; }
    .head-meta strong { color: var(--ink); font-weight: 650; }
    .head-actions { display: flex; flex-direction: column; align-items: stretch; gap: 10px; min-width: 260px; }
    .summary-card { min-width: 260px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255, 255, 255, .38); }
    .summary-card-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .summary-counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .summary-count { padding: 8px 4px; border-radius: 6px; background: var(--surface-soft); text-align: center; }
    .summary-count strong { display: block; font-size: 18px; line-height: 1.1; }
    .summary-count span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .summary-count.done strong { color: var(--green); }
    .summary-count.blocked strong { color: var(--red); }
    .report-button, .ghost-button, .filter-button { display: inline-flex; align-items: center; justify-content: center; min-height: 35px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--ink); background: rgba(255, 249, 238, .75); cursor: pointer; font-size: 13px; font-weight: 700; }
    .report-button { color: #fff9ee; background: var(--ink); border-color: var(--ink); }
    .report-button:hover, .ghost-button:hover, .filter-button:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(23, 19, 13, .12); }
    .freshness { color: var(--muted); font: 11px/1.5 var(--mono); }
    .freshness.stale { color: var(--red); font-weight: 700; }
    .workspace-shell { width: min(1380px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 46px; }
    .content { min-width: 0; }
    .tabs { display: flex; gap: 5px; overflow-x: auto; padding: 0 0 10px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
    .tab { flex: 0 0 auto; min-height: 37px; padding: 0 13px; border: 0; border-radius: 6px 6px 0 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 13px; font-weight: 750; }
    .tab:hover, .tab.active { color: var(--ink); background: var(--surface); box-shadow: inset 0 -2px 0 var(--ink); }
    .tab-panel { display: none; padding-top: 23px; }
    .tab-panel.active { display: block; animation: rise .25s ease both; }
    @keyframes rise { from { opacity: .2; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .panel-intro { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 17px; }
    .panel-intro p { max-width: 760px; margin-bottom: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .panel-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .phase-switch { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 6px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255, 249, 238, .72); }
    .phase-button { flex: 1 1 150px; min-height: 38px; padding: 0 12px; border: 1px solid transparent; border-radius: 6px; color: var(--muted); background: transparent; cursor: pointer; text-align: left; }
    .phase-button strong { display: block; color: var(--ink); font-size: 13px; }
    .phase-button small { display: block; margin-top: 3px; font-size: 11px; }
    .phase-button:hover, .phase-button.active { border-color: var(--line-strong); background: var(--surface); box-shadow: 0 4px 14px rgba(33, 24, 10, .08); }
    .phase-button.active { box-shadow: inset 0 -2px 0 var(--orange); }
    .search, .select { min-height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--ink); background: rgba(255, 249, 238, .82); font-size: 13px; }
    .search { min-width: min(360px, 100%); flex: 1 1 250px; }
    .select { min-width: 150px; }
    .notice { margin-bottom: 15px; padding: 11px 13px; border-left: 3px solid var(--orange); background: var(--surface-tint); color: #5c3b22; font-size: 13px; line-height: 1.5; }
    .notice.error { border-left-color: var(--red); background: rgba(185, 75, 56, .09); color: #7f2d24; }
    .timeline, .aggregate-list, .map-grid, .manual-grid, .report-grid { display: grid; gap: 12px; }
    .timeline-card, .aggregate-card, .map-card, .manual-card, .report-card { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255, 249, 238, .8); box-shadow: 0 8px 26px rgba(33, 24, 10, .04); }
    .timeline-card { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; padding: 16px; }
    .timeline-date { color: var(--muted); font: 11px/1.5 var(--mono); }
    .timeline-main { min-width: 0; }
    .timeline-head, .card-head, .report-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .timeline-head h3, .card-head h3 { margin-bottom: 4px; }
    .timeline-summary, .card-copy, .section-copy, .report-copy { margin-bottom: 10px; color: #50483d; font-size: 13px; line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { min-height: 23px; padding: 0 8px; color: var(--muted); background: var(--surface-soft); font-size: 11px; }
    .chip a { text-decoration: underline; text-underline-offset: 2px; }
    .chip.status-done { color: #1f6f42; background: rgba(47, 139, 87, .12); }
    .chip.status-active, .chip.status-review { color: #925014; background: rgba(213, 111, 43, .13); }
    .chip.status-blocked { color: #8d2d22; background: rgba(185, 75, 56, .12); }
    .chip.status-planned { color: #225d8e; background: rgba(35, 104, 162, .11); }
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 8px; }
    .board-column { min-width: 0; min-height: 250px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(243, 234, 216, .67); }
    .board-column-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .board-column-head strong { color: var(--ink); font-size: 17px; }
    .task-card { display: block; width: 100%; min-width: 0; margin-bottom: 8px; padding: 11px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--surface); cursor: pointer; text-align: left; }
    .task-card:last-child { margin-bottom: 0; }
    .task-card:hover, .task-card:focus-visible { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 7px 18px rgba(33, 24, 10, .09); outline: none; }
    .task-card h4 { margin: 4px 0 0; line-height: 1.35; overflow-wrap: anywhere; word-break: break-word; }
    .task-id { display: block; color: var(--muted); font: 10px var(--mono); }
    .meeting-row { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 17px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); background: rgba(255, 249, 238, .8); box-shadow: 0 8px 26px rgba(33, 24, 10, .04); cursor: pointer; text-align: left; }
    .meeting-row:hover, .meeting-row:focus-visible { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 9px 28px rgba(33, 24, 10, .09); outline: none; }
    .meeting-row-main { min-width: 0; }
    .meeting-row h3 { margin-bottom: 4px; overflow-wrap: anywhere; }
    .meeting-row-meta { display: flex; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .aggregate-card { padding: 15px 17px; }
    .aggregate-card summary { cursor: pointer; list-style: none; }
    .aggregate-card summary::-webkit-details-marker { display: none; }
    .aggregate-card summary::after { float: right; content: "+"; color: var(--muted); font-weight: 700; }
    .aggregate-card[open] summary::after { content: "−"; }
    .aggregate-body { padding-top: 14px; border-top: 1px solid var(--line); }
    .aggregate-body p, .aggregate-body li { color: #50483d; font-size: 13px; line-height: 1.6; }
    .aggregate-body ul { margin: 8px 0 0; padding-left: 20px; }
    .map-card, .manual-card, .report-card { padding: 16px; }
    .function-list { display: grid; gap: 18px; }
    .module-section { scroll-margin-top: 14px; padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255, 249, 238, .48); }
    .module-section > h3 { margin-bottom: 5px; }
    .module-section > .section-copy { margin-bottom: 13px; }
    .map-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .map-card h3 { margin-bottom: 12px; }
    .map-node { margin-bottom: 8px; padding: 9px; border-left: 3px solid var(--blue); background: rgba(35, 104, 162, .07); }
    .map-node strong { display: block; font-size: 13px; }
    .map-node code { display: block; margin-top: 4px; color: var(--muted); font: 10px var(--mono); word-break: break-word; }
    .edge-list { margin: 0; padding-left: 20px; }
    .edge-list li { margin-bottom: 7px; color: #50483d; font-size: 12px; line-height: 1.45; }
    .manual-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .manual-card p, .manual-card li { color: #50483d; font-size: 13px; line-height: 1.55; }
    .manual-card ul { margin: 8px 0 0; padding-left: 19px; }
    .report-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .report-card strong.report-number { display: block; margin-bottom: 5px; font: 750 28px/1 ui-serif, Georgia, serif; }
    .report-card.risk { border-color: rgba(185, 75, 56, .35); }
    .report-card.risk strong.report-number { color: var(--red); }
    .empty { padding: 24px; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); text-align: center; font-size: 13px; }
    .footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.5; }
    dialog { width: min(700px, calc(100% - 28px)); max-height: 88vh; padding: 0; overflow: auto; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(23, 19, 13, .35); backdrop-filter: blur(2px); }
    .dialog-inner { padding: 22px; }
    .dialog-close { float: right; min-width: 32px; min-height: 32px; border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; }
    .meeting-task-list { display: grid; gap: 7px; margin-top: 12px; }
    .meeting-task-button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--surface-soft); cursor: pointer; text-align: left; }
    .meeting-task-button:hover, .meeting-task-button:focus-visible { border-color: var(--line-strong); background: var(--surface-tint); outline: none; }
    .meeting-task-title { min-width: 0; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
    .detail-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px 13px; margin: 16px 0; font-size: 13px; }
    .detail-grid dt { color: var(--muted); }
    .detail-grid dd { margin: 0; line-height: 1.5; }
    code { font-family: var(--mono); font-size: .9em; }
    @media (max-width: 1050px) {
      .map-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .project-head { padding: 18px 15px 0; }
      .head-grid { display: block; }
      .head-actions { margin-bottom: 18px; }
      .summary-card { min-width: 0; }
      .workspace-shell { width: min(100% - 20px, 1380px); padding-top: 14px; }
      h1 { font-size: 28px; }
      .panel-intro { display: block; }
      .panel-intro p { margin-top: 8px; }
      .timeline-card { grid-template-columns: 1fr; gap: 7px; }
      .manual-grid, .report-grid, .map-grid { grid-template-columns: 1fr; }
      .board { grid-template-columns: repeat(5, minmax(240px, 1fr)); }
      .meeting-row { align-items: flex-start; flex-direction: column; gap: 9px; }
      .meeting-row-meta { justify-content: flex-start; }
      .meeting-task-button { grid-template-columns: 1fr; gap: 5px; }
      .footer { display: block; }
      .footer span { display: block; margin-bottom: 6px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="project-head">
      <div class="head-grid">
        <div>
          <div class="eyebrow"><span class="status-dot"></span> SupportPortal / Project Workspace</div>
          <div class="title-row">
            <h1 id="projectTitle">SupportPortal</h1>
            <span class="status-pill"><span class="status-dot"></span><span id="projectStatus">加载中</span></span>
          </div>
          <section class="goal-card" aria-labelledby="goalTitle">
            <div class="goal-label" id="goalTitle">🎯 当前项目目标</div>
            <div class="goal-body" id="projectGoal">正在加载项目 registry...</div>
          </section>
          <div class="head-meta">
            <span>当前阶段 <strong id="currentPhase">--</strong></span>
            <span>负责人 <strong id="projectOwner">--</strong></span>
            <span>功能模块 <strong id="moduleCount">--</strong></span>
            <span>能力 <strong id="functionCount">--</strong></span>
            <span>Task <strong id="taskCount">--</strong></span>
          </div>
        </div>
        <aside class="head-actions" aria-label="项目状态概览">
          <div class="summary-card">
            <div class="summary-card-head"><span>Task 状态概览</span><span id="registryDigest">--</span></div>
            <div class="summary-counts" id="summaryCounts"></div>
          </div>
          <button class="report-button" id="reportButton" type="button">打开汇报模式 →</button>
          <div class="freshness" id="freshness">生成时间：--</div>
        </aside>
      </div>
    </header>

    <div class="workspace-shell">
      <main class="content">
        <div class="phase-switch" id="phaseSwitch" aria-label="Phase 切换"></div>
        <nav class="tabs" id="tabs" aria-label="项目内容切换" role="tablist"></nav>
        <section class="tab-panel active" id="panel-dynamic" role="tabpanel" aria-labelledby="tab-dynamic"></section>
        <section class="tab-panel" id="panel-plan" role="tabpanel" aria-labelledby="tab-plan"></section>
        <section class="tab-panel" id="panel-human-events" role="tabpanel" aria-labelledby="tab-human-events"></section>
        <section class="tab-panel" id="panel-functions" role="tabpanel" aria-labelledby="tab-functions"></section>
        <section class="tab-panel" id="panel-system-map" role="tabpanel" aria-labelledby="tab-system-map"></section>
        <section class="tab-panel" id="panel-manual" role="tabpanel" aria-labelledby="tab-manual"></section>
        <section class="tab-panel" id="panel-report" role="tabpanel" aria-labelledby="tab-report"></section>
        <footer class="footer">
          <span>文件：docs/projectoverview.html</span>
          <span>状态来源：docs/project/phases · modules · functions · tasks · 生成物：docs/projectoverview-data.js</span>
        </footer>
      </main>
    </div>
  </div>

  <dialog id="taskDialog" aria-labelledby="taskDialogTitle">
    <div class="dialog-inner" id="taskDialogContent"></div>
  </dialog>

  <dialog id="meetingDialog" aria-labelledby="meetingDialogTitle">
    <div class="dialog-inner" id="meetingDialogContent"></div>
  </dialog>

  <dialog id="functionDialog" aria-labelledby="functionDialogTitle">
    <div class="dialog-inner" id="functionDialogContent"></div>
  </dialog>

  <script src="./projectoverview-data.js"></script>
  <script>
    (() => {
      const DATA = window.SUPPORTPORTAL_PROJECT_DATA;
      const statusMeta = {
        planned: { label: "未开始", className: "planned" },
        active: { label: "进行中", className: "active" },
        review: { label: "验收中", className: "review" },
        blocked: { label: "阻塞", className: "blocked" },
        done: { label: "完成", className: "done" }
      };
      const tabs = [
        { id: "dynamic", label: "项目动态" },
        { id: "plan", label: "任务看板" },
        { id: "human-events", label: "会议记录" },
        { id: "functions", label: "能力地图" },
        { id: "system-map", label: "系统地图" },
        { id: "manual", label: "用户手册" },
        { id: "report", label: "汇报模式" }
      ];
      const state = { phase: DATA?.project?.current_phase_id || "phase-2", query: "", module: "all", function: "all", reportDays: 7 };
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      const formatDate = (value) => value ? String(value).slice(0, 10) : "未记录";
      const formatStatus = (status) => statusMeta[status]?.label || status;
      const phases = Array.isArray(DATA?.phases) ? DATA.phases : [];
      const modules = Array.isArray(DATA?.modules) ? DATA.modules : [];
      const functions = Array.isArray(DATA?.functions) ? DATA.functions : [];
      const tasks = Array.isArray(DATA?.tasks) ? DATA.tasks : [];
      const meetings = Array.isArray(DATA?.meetings) ? DATA.meetings : [];
      const phaseMap = new Map(phases.map((phase) => [phase.phase_id, phase]));
      const moduleMap = new Map(modules.map((module) => [module.module_id, module]));
      const functionMap = new Map(functions.map((item) => [item.function_id, item]));
      const taskMap = new Map(tasks.map((task) => [task.task_id, task]));
      const meetingMap = new Map(meetings.map((meeting) => [meeting.meeting_id, meeting]));
      const aliases = DATA?.migration?.aliases || {};
      const moduleFor = (task) => moduleMap.get(task.module_id);
      const functionFor = (task) => functionMap.get(task.function_id);
      const phaseFor = (item) => phaseMap.get(item.phase_id);
      const statusChip = (status) => `<span class="chip status-${escapeHtml(status)}">${escapeHtml(formatStatus(status))}</span>`;
      const idLabel = (id) => `#${id}`;
      const taskEvidence = (task) => Array.isArray(task?.evidence) ? task.evidence : [];
      const taskPrNumbers = (task) => taskEvidence(task).filter((item) => item.type === "pr" && item.number).map((item) => String(item.number));
      const resolveAlias = (id) => aliases[id] || null;

      const repoLink = (source) => {
        if (!source || String(source).startsWith("/")) return "";
        const base = DATA?.project?.repository_url;
        return base ? `${base}/blob/main/${String(source).replace(/^\.\//, "")}` : "";
      };
      const sourceMarkup = (source) => {
        const url = repoLink(source);
        return url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"><code>${escapeHtml(source)}</code></a>` : `<code>${escapeHtml(source)}</code>`;
      };
      const evidenceMarkup = (items) => (items || []).map((item) => item.url ? `<li><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.label || item.url)}</a></li>` : `<li>${escapeHtml(item.label || item.type)}</li>`).join("");
      const phaseTasks = () => tasks.filter((task) => task.phase_id === state.phase);
      const phaseFunctions = () => functions.filter((item) => item.phase_id === state.phase);

      function renderHeader() {
        const phase = phaseMap.get(state.phase) || phases[0];
        const visible = phaseTasks();
        const visibleFunctions = phaseFunctions();
        document.getElementById("projectTitle").textContent = DATA.project.title;
        document.getElementById("projectStatus").textContent = DATA.project.status === "active" ? "进行中" : DATA.project.status;
        document.getElementById("projectGoal").textContent = DATA.project.goal;
        document.getElementById("currentPhase").textContent = phase?.title || state.phase;
        document.getElementById("projectOwner").textContent = DATA.project.owner || "未指定";
        document.getElementById("moduleCount").textContent = String(new Set(visible.map((task) => task.module_id)).size);
        document.getElementById("functionCount").textContent = String(visibleFunctions.length);
        document.getElementById("taskCount").textContent = String(visible.length);
        const counts = Object.fromEntries(Object.keys(statusMeta).map((status) => [status, visible.filter((task) => task.status === status).length]));
        document.getElementById("summaryCounts").innerHTML = Object.entries(statusMeta).map(([status, meta]) => `<div class="summary-count ${meta.className}"><strong>${counts[status]}</strong><span>${meta.label}</span></div>`).join("");
        document.getElementById("registryDigest").textContent = `${String(DATA.registry_digest || "").slice(0, 8)}…`;
        const generated = DATA.generated_at ? new Date(DATA.generated_at) : null;
        const freshness = document.getElementById("freshness");
        freshness.textContent = `生成：${generated ? generated.toLocaleString("zh-CN") : "未记录"} · 基线 ${String(DATA.source_base_commit || "").slice(0, 8)}`;
      }

      function renderPhaseSwitch() {
        document.getElementById("phaseSwitch").innerHTML = phases.map((phase) => {
          const count = tasks.filter((task) => task.phase_id === phase.phase_id).length;
          return `<button class="phase-button ${state.phase === phase.phase_id ? "active" : ""}" type="button" data-phase-id="${escapeHtml(phase.phase_id)}"><strong>${escapeHtml(phase.title)}</strong><small>${count} 个 Task · ${escapeHtml(phase.status === "done" ? "已完成" : phase.status === "active" ? "进行中" : "未开始")}</small></button>`;
        }).join("");
        document.querySelectorAll("[data-phase-id]").forEach((button) => button.addEventListener("click", () => {
          state.phase = button.dataset.phaseId;
          renderHeader(); renderPhaseSwitch(); renderDynamic(); renderBoard(); renderFunctions(); renderReport();
        }));
      }

      function renderTabs() {
        document.getElementById("tabs").innerHTML = tabs.map((tab) => `<button class="tab" id="tab-${tab.id}" type="button" role="tab" aria-controls="panel-${tab.id}" aria-selected="false" data-tab="${tab.id}">${tab.label}</button>`).join("");
        document.querySelectorAll("[data-tab]").forEach((button) => button.addEventListener("click", () => setTab(button.dataset.tab)));
      }

      function bindTriggers(root) {
        const nestedTask = root.id === "functionDialog";
        root.querySelectorAll("[data-task-id]").forEach((trigger) => trigger.addEventListener("click", () => showTask(trigger.dataset.taskId, !nestedTask, nestedTask)));
        root.querySelectorAll("[data-function-id]").forEach((trigger) => trigger.addEventListener("click", () => showFunction(trigger.dataset.functionId)));
      }

      function renderDynamic() {
        const prs = Array.isArray(DATA.pr_index?.prs) ? DATA.pr_index.prs : [];
        const summaries = DATA.pr_summaries?.summaries || {};
        const cards = prs.map((pr) => {
          const summary = summaries[String(pr.number)] || {};
          const linkedTasks = (summary.task_ids || []).map((id) => taskMap.get(id)).filter(Boolean);
          const linkedFunctions = (summary.function_ids || []).map((id) => functionMap.get(id)).filter(Boolean);
          linkedTasks.forEach((task) => taskPrNumbers(task).includes(String(pr.number)) || null);
          return `<article class="timeline-card"><time class="timeline-date">${escapeHtml(formatDate(pr.mergedAt || pr.updatedAt || pr.createdAt))}</time><div class="timeline-main"><div class="timeline-head"><div><div class="section-kicker">PR #${escapeHtml(pr.number)}</div><h3>${escapeHtml(pr.title)}</h3></div><span class="chip">${escapeHtml(pr.state || "merged")}</span></div><p class="timeline-summary">${escapeHtml(summary.summary || "已同步 PR 公开元数据；等待补充一句话摘要。")}</p><div class="chips">${linkedFunctions.map((item) => `<button class="chip" type="button" data-function-id="${escapeHtml(item.function_id)}">${escapeHtml(idLabel(item.function_id))} · ${escapeHtml(item.title)}</button>`).join("")}${linkedTasks.map((task) => `<button class="chip" type="button" data-task-id="${escapeHtml(task.task_id)}">${escapeHtml(idLabel(task.task_id))} · ${escapeHtml(task.title)}</button>`).join("")}${!linkedTasks.length && !linkedFunctions.length ? `<span class="chip status-review">待归档：尚未关联能力或 Task</span>` : ""}</div></div></article>`;
        }).join("");
        const panel = document.getElementById("panel-dynamic");
        panel.innerHTML = `<div class="panel-intro"><div><div class="section-kicker">01 / Activity</div><h2>项目动态</h2><p>PR 是主要动态来源；每条动态通过 Function 和 Task 回到同一个项目 registry。</p></div></div><div class="notice">PR 快照：${escapeHtml(DATA.pr_index?.fetched_at || "尚未同步")} · 页面不读取 PR body，只使用公开元数据和脱敏摘要。</div><div class="timeline">${cards || `<div class="empty">暂无 PR 动态。</div>`}</div>`;
        bindTriggers(panel);
      }

      function renderBoard() {
        const visible = phaseTasks().filter((task) => {
          const haystack = [task.task_id, task.title, task.summary, task.owner, task.next_action, moduleFor(task)?.title || "", functionFor(task)?.title || ""].join(" ").toLowerCase();
          return (!state.query || haystack.includes(state.query.toLowerCase())) && (state.module === "all" || task.module_id === state.module) && (state.function === "all" || task.function_id === state.function);
        });
        const columns = Object.entries(statusMeta).map(([status, meta]) => {
          const columnTasks = visible.filter((task) => task.status === status);
          return `<section class="board-column" aria-label="${meta.label}"><div class="board-column-head"><span>${meta.label}</span><strong>${columnTasks.length}</strong></div>${columnTasks.map((task) => `<button class="task-card" type="button" data-task-id="${escapeHtml(task.task_id)}" aria-label="打开 Task ${escapeHtml(idLabel(task.task_id))}：${escapeHtml(task.title)}"><span class="task-id">${escapeHtml(idLabel(task.task_id))}</span><h4>${escapeHtml(task.title)}</h4></button>`).join("") || `<div class="empty">暂无 Task</div>`}</section>`;
        }).join("");
        const availableModules = modules.filter((module) => phaseTasks().some((task) => task.module_id === module.module_id));
        const availableFunctions = phaseFunctions().filter((item) => state.module === "all" || item.module_id === state.module);
        const panel = document.getElementById("panel-plan");
        panel.innerHTML = `<div class="panel-intro"><div><div class="section-kicker">02 / Tasks</div><h2>任务看板</h2><p>当前显示 ${escapeHtml(phaseMap.get(state.phase)?.title || state.phase)} 的 Task；卡片只保留 #ID 和标题，点击后查看证据与上下文。</p></div></div><div class="panel-tools"><input class="search" id="taskSearch" type="search" placeholder="搜索 Task、能力、负责人或下一步" value="${escapeHtml(state.query)}" aria-label="搜索 Task"><select class="select" id="moduleFilter" aria-label="按功能模块筛选"><option value="all">全部功能模块</option>${availableModules.map((item) => `<option value="${escapeHtml(item.module_id)}" ${state.module === item.module_id ? "selected" : ""}>${escapeHtml(item.title)}</option>`).join("")}</select><select class="select" id="functionFilter" aria-label="按能力筛选"><option value="all">全部能力</option>${availableFunctions.map((item) => `<option value="${escapeHtml(item.function_id)}" ${state.function === item.function_id ? "selected" : ""}>${escapeHtml(idLabel(item.function_id))} · ${escapeHtml(item.title)}</option>`).join("")}</select></div><div class="board">${columns}</div>`;
        document.getElementById("taskSearch").addEventListener("input", (event) => { state.query = event.target.value; renderBoard(); });
        document.getElementById("moduleFilter").addEventListener("change", (event) => { state.module = event.target.value; state.function = "all"; renderBoard(); });
        document.getElementById("functionFilter").addEventListener("change", (event) => { state.function = event.target.value; renderBoard(); });
        bindTriggers(panel);
      }

      function renderMeetings() {
        const content = meetings.map((meeting) => {
          const meetingTasks = (meeting.task_ids || []).map((id) => taskMap.get(id)).filter(Boolean);
          const meetingFunctions = (meeting.function_ids || []).map((id) => functionMap.get(id)).filter(Boolean);
          return `<button class="meeting-row" id="meeting-${escapeHtml(meeting.meeting_id)}" type="button" data-meeting-id="${escapeHtml(meeting.meeting_id)}" aria-label="打开会议记录：${escapeHtml(meeting.title)}"><span class="meeting-row-main"><span class="section-kicker">Meeting</span><h3>${escapeHtml(meeting.title)}</h3></span><span class="meeting-row-meta"><span class="chip">${escapeHtml(formatDate(meeting.date))}</span><span class="chip">${meetingTasks.length} 个 Task</span><span class="chip">${meetingFunctions.length} 个能力</span></span></button>`;
        }).join("");
        const panel = document.getElementById("panel-human-events");
        panel.innerHTML = `<div class="panel-intro"><div><div class="section-kicker">03 / Meetings</div><h2>会议记录</h2><p>会议记录保留讨论背景、决定和未决问题，并通过 Function 与 Task 连接当前进度。</p></div></div><div class="aggregate-list">${content || `<div class="empty">暂无会议记录。</div>`}</div>`;
        panel.querySelectorAll("[data-meeting-id]").forEach((button) => button.addEventListener("click", () => showMeeting(button.dataset.meetingId)));
      }

      function renderFunctions() {
        const visibleFunctions = phaseFunctions();
        const content = modules.map((module) => {
          const moduleFunctions = visibleFunctions.filter((item) => item.module_id === module.module_id);
          if (!moduleFunctions.length) return "";
          return `<section class="module-section" id="module-${escapeHtml(module.module_id)}"><div class="section-kicker">功能模块</div><h3>${escapeHtml(module.title)}</h3><p class="section-copy">${escapeHtml(module.goal || "")}</p><div class="aggregate-list">${moduleFunctions.map((item) => `<button class="meeting-row" type="button" data-function-id="${escapeHtml(item.function_id)}"><span class="meeting-row-main"><span class="section-kicker">${escapeHtml(idLabel(item.function_id))} · Function</span><h3>${escapeHtml(item.title)}</h3></span><span class="meeting-row-meta">${statusChip(item.status)}<span class="chip">${item.done_count}/${item.task_count} Task</span></span></button>`).join("")}</div></section>`;
        }).join("");
        const panel = document.getElementById("panel-functions");
        panel.innerHTML = `<div class="panel-intro"><div><div class="section-kicker">04 / Functions</div><h2>能力地图</h2><p>先按功能模块定位业务域，再按 Function 查看能力目标和完整 Task 清单。当前仅显示选定 Phase。</p></div></div><div class="function-list">${content || `<div class="empty">当前 Phase 暂无能力记录。</div>`}</div>`;
        bindTriggers(panel);
      }

      function renderSystemMap() {
        const map = DATA.system_map || { layers: [], nodes: [], edges: [] };
        const layerCards = (map.layers || []).map((layer) => `<article class="map-card"><div class="section-kicker">${escapeHtml(layer)}</div><h3>${escapeHtml(layer === "surface" ? "UI / URL" : layer === "api" ? "API" : layer === "service" ? "Service" : layer === "data" ? "Repository / Storage" : layer === "external" ? "External" : "Tests")}</h3>${(map.nodes || []).filter((node) => node.layer === layer).map((node) => `<div class="map-node"><strong>${escapeHtml(node.label)}</strong>${node.path ? `<code>${escapeHtml(node.path)}</code>` : ""}</div>`).join("") || `<p class="freshness">暂无节点</p>`}</article>`).join("");
        const edges = (map.edges || []).map((edge) => { const from = (map.nodes || []).find((node) => node.id === edge.from); const to = (map.nodes || []).find((node) => node.id === edge.to); return `<li><strong>${escapeHtml(from?.label || edge.from)}</strong> → <strong>${escapeHtml(to?.label || edge.to)}</strong>：${escapeHtml(edge.label)}</li>`; }).join("");
        document.getElementById("panel-system-map").innerHTML = `<div class="panel-intro"><div><div class="section-kicker">05 / Architecture</div><h2>系统地图</h2><p>展示功能模块到 UI、API、Service、Storage、External 和 Tests 的可读架构关系。</p></div></div><div class="notice">架构快照基于 commit ${escapeHtml(String(DATA.source_base_commit || "").slice(0, 8))}；代码关系变化后重新生成 Overview。</div><div class="map-grid">${layerCards}</div><article class="map-card" style="margin-top:12px"><h3>连接关系</h3><ol class="edge-list">${edges || "<li>暂无关系。</li>"}</ol></article>`;
      }

      function renderManual() {
        const sections = (DATA.manual?.sections || []).map((section) => `<article class="manual-card"><div class="section-kicker">${escapeHtml(section.audience || "项目使用")}</div><h3>${escapeHtml(section.title)}</h3><p><strong>入口：</strong><code>${escapeHtml(section.entrypoint || "")}</code></p><ul>${(section.steps || []).map((step) => `<li>${escapeHtml(step)}</li>`).join("")}</ul><p style="margin-top:10px"><strong>依据：</strong>${(section.source_refs || []).map(sourceMarkup).join(" · ")}</p></article>`).join("");
        const features = (DATA.features || []).map((section) => `<details class="aggregate-card"><summary><strong>${escapeHtml(section.title)}</strong><span class="chip">已完成 ${(section.completed || []).length} · 未完成 ${(section.planned || []).length}</span></summary><div class="aggregate-body"><h4>已完成能力</h4><ul>${(section.completed || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("") || "<li>暂无</li>"}</ul><h4 style="margin-top:12px">未完成能力</h4><ul>${(section.planned || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("") || "<li>暂无</li>"}</ul></div></details>`).join("");
        document.getElementById("panel-manual").innerHTML = `<div class="panel-intro"><div><div class="section-kicker">06 / Handbook</div><h2>用户手册</h2><p>这里回答“怎么使用项目”和“AI 下一步怎么开工”。产品能力继续从 feature list 读取，维护规则从 registry README 和项目规则读取。</p></div></div><div class="manual-grid">${sections}</div><h3 style="margin-top:25px">产品能力目录</h3><div class="aggregate-list">${features}</div>`;
      }

      function renderReport() {
        const days = state.reportDays;
        const cutoff = Date.now() - days * 86400000;
        const phase = phaseMap.get(state.phase);
        const prs = (DATA.pr_index?.prs || []).filter((pr) => new Date(pr.mergedAt || pr.updatedAt || pr.createdAt || 0).getTime() >= cutoff);
        const recentTasks = phaseTasks().filter((task) => new Date(task.updated_at || 0).getTime() >= cutoff);
        const blocked = phaseTasks().filter((task) => task.status === "blocked");
        const active = phaseTasks().filter((task) => ["active", "review"].includes(task.status));
        document.getElementById("panel-report").innerHTML = `<div class="panel-intro"><div><div class="section-kicker">07 / Briefing</div><h2>汇报模式</h2><p>这是从当前 Phase 的 Function、Task、PR 和 Meeting 派生的汇报视图。</p></div><div class="panel-tools"><button class="filter-button ${days === 7 ? "active" : ""}" data-report-days="7" type="button">最近 7 天</button><button class="filter-button ${days === 30 ? "active" : ""}" data-report-days="30" type="button">最近 30 天</button></div></div><div class="report-grid"><article class="report-card"><strong class="report-number">${prs.length}</strong><p class="report-copy">窗口内 PR</p><p class="freshness">${prs.slice(0, 3).map((pr) => `#${escapeHtml(pr.number)} ${escapeHtml(pr.title)}`).join("<br>") || "暂无"}</p></article><article class="report-card"><strong class="report-number">${recentTasks.length}</strong><p class="report-copy">窗口内更新 Task</p><p class="freshness">${recentTasks.filter((task) => task.status === "done").length} 个完成 · ${recentTasks.filter((task) => task.status !== "done").length} 个未完成</p></article><article class="report-card ${blocked.length ? "risk" : ""}"><strong class="report-number">${blocked.length}</strong><p class="report-copy">当前阻塞 Task</p><p class="freshness">${blocked.slice(0, 3).map((task) => `${escapeHtml(idLabel(task.task_id))} ${escapeHtml(task.title)}`).join("<br>") || "当前没有阻塞 Task"}</p></article></div><article class="report-card" style="margin-top:12px"><div class="report-head"><div><h3>Phase 健康度</h3><p class="report-copy">当前阶段：${escapeHtml(phase?.title || state.phase)}</p></div><span class="chip status-${escapeHtml(phase?.status || "active")}">${escapeHtml(phase?.status === "done" ? "完成" : phase?.status === "active" ? "进行中" : "未开始")}</span></div><ul class="edge-list">${(phase?.exit_criteria || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul><p class="freshness">汇报窗口：${days} 天 · 数据生成：${escapeHtml(DATA.generated_at || "未记录")}</p></article><article class="report-card" style="margin-top:12px"><h3>下一步</h3><ul class="edge-list">${active.slice(0, 8).map((task) => `<li><strong>${escapeHtml(idLabel(task.task_id))}</strong> ${escapeHtml(task.next_action || task.title)}</li>`).join("") || "<li>暂无进行中或验收中 Task。</li>"}</ul></article>`;
        document.querySelectorAll("[data-report-days]").forEach((button) => button.addEventListener("click", () => { state.reportDays = Number(button.dataset.reportDays); renderReport(); }));
      }

      function showTask(taskId, updateHash = true, keepFunctionDialog = false) {
        const alias = resolveAlias(taskId);
        if (alias?.target_type === "function") return showFunction(alias.target_id, updateHash);
        const task = taskMap.get(alias?.target_id || taskId);
        if (!task) return;
        if (document.getElementById("meetingDialog").open) document.getElementById("meetingDialog").close();
        if (!keepFunctionDialog && document.getElementById("functionDialog").open) document.getElementById("functionDialog").close();
        state.phase = task.phase_id;
        renderHeader(); renderPhaseSwitch(); renderBoard(); renderFunctions();
        if (updateHash) location.hash = `task-${encodeURIComponent(task.task_id)}`;
        const dialog = document.getElementById("taskDialog");
        document.getElementById("taskDialogContent").innerHTML = `<button class="dialog-close" type="button" aria-label="关闭">×</button><div class="section-kicker">Task detail</div><h2 id="taskDialogTitle">${escapeHtml(idLabel(task.task_id))} · ${escapeHtml(task.title)}</h2><div class="chips">${statusChip(task.status)}<span class="chip">${escapeHtml(moduleFor(task)?.title || "未关联功能模块")}</span><button class="chip" type="button" data-function-id="${escapeHtml(task.function_id)}">${escapeHtml(idLabel(task.function_id))} · ${escapeHtml(functionFor(task)?.title || "未关联能力")}</button><span class="chip">${escapeHtml(phaseFor(task)?.title || task.phase_id)}</span></div><dl class="detail-grid"><dt>负责人</dt><dd>${escapeHtml(task.owner || "未指定")}</dd><dt>摘要</dt><dd>${escapeHtml(task.summary || "暂无")}</dd><dt>下一步</dt><dd>${escapeHtml(task.next_action || "—")}</dd><dt>验收条件</dt><dd>${(task.acceptance_criteria || []).map(escapeHtml).join("<br>") || "—"}</dd><dt>阻塞原因</dt><dd>${(task.blockers || []).map(escapeHtml).join("<br>") || "—"}</dd><dt>旧 ID</dt><dd>${(task.legacy_ids || []).map((id) => escapeHtml(idLabel(id))).join("、") || "—"}</dd></dl><h3>Evidence</h3><ul class="edge-list">${evidenceMarkup(taskEvidence(task)) || "<li>暂无证据。</li>"}</ul><p class="freshness">来源：${(task.source_refs || []).map(sourceMarkup).join(" · ")}</p>`;
        dialog.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
        bindTriggers(dialog);
        if (typeof dialog.showModal === "function") dialog.showModal(); else dialog.setAttribute("open", "");
      }

      function showFunction(functionId, updateHash = true) {
        const alias = resolveAlias(functionId);
        const item = functionMap.get(alias?.target_id || functionId);
        if (!item) return;
        if (document.getElementById("meetingDialog").open) document.getElementById("meetingDialog").close();
        if (document.getElementById("taskDialog").open) document.getElementById("taskDialog").close();
        state.phase = item.phase_id;
        renderHeader(); renderPhaseSwitch(); renderBoard(); renderFunctions();
        if (updateHash) location.hash = `function-${encodeURIComponent(item.function_id)}`;
        const children = tasks.filter((task) => task.function_id === item.function_id);
        const dialog = document.getElementById("functionDialog");
        document.getElementById("functionDialogContent").innerHTML = `<button class="dialog-close" type="button" aria-label="关闭">×</button><div class="section-kicker">Function detail</div><h2 id="functionDialogTitle">${escapeHtml(idLabel(item.function_id))} · ${escapeHtml(item.title)}</h2><div class="chips">${statusChip(item.status)}<span class="chip">${escapeHtml(moduleMap.get(item.module_id)?.title || item.module_id)}</span><span class="chip">${escapeHtml(phaseFor(item)?.title || item.phase_id)}</span><span class="chip">${item.done_count}/${item.task_count} Task</span></div><p class="section-copy">${escapeHtml(item.goal || "暂无能力目标")}</p><h3>关联 Task</h3><div class="meeting-task-list">${children.map((task) => `<button class="meeting-task-button" type="button" data-task-id="${escapeHtml(task.task_id)}"><span class="task-id">${escapeHtml(idLabel(task.task_id))}</span><span class="meeting-task-title">${escapeHtml(task.title)}</span>${statusChip(task.status)}</button>`).join("") || `<div class="empty">暂无关联 Task。</div>`}</div><h3>Evidence</h3><ul class="edge-list">${evidenceMarkup(item.evidence) || "<li>暂无证据。</li>"}</ul><p class="freshness">来源：${(item.source_refs || []).map(sourceMarkup).join(" · ")}</p>`;
        dialog.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
        bindTriggers(dialog);
        if (typeof dialog.showModal === "function") { if (!dialog.open) dialog.showModal(); } else dialog.setAttribute("open", "");
      }

      function showMeeting(meetingId) {
        const meeting = meetingMap.get(meetingId);
        if (!meeting) return;
        if (document.getElementById("taskDialog").open) document.getElementById("taskDialog").close();
        if (document.getElementById("functionDialog").open) document.getElementById("functionDialog").close();
        if (location.hash !== `meeting-${encodeURIComponent(meetingId)}`) location.hash = `meeting-${encodeURIComponent(meetingId)}`;
        const dialog = document.getElementById("meetingDialog");
        const meetingTasks = (meeting.task_ids || []).map((id) => taskMap.get(id)).filter(Boolean);
        const meetingFunctions = (meeting.function_ids || []).map((id) => functionMap.get(id)).filter(Boolean);
        document.getElementById("meetingDialogContent").innerHTML = `<button class="dialog-close" type="button" aria-label="关闭">×</button><div class="section-kicker">Meeting record</div><h2 id="meetingDialogTitle">${escapeHtml(meeting.title)}</h2><div class="chips"><span class="chip">${escapeHtml(formatDate(meeting.date))}</span><span class="chip">${meetingTasks.length} 个 Task</span><span class="chip">${meetingFunctions.length} 个能力</span></div><dl class="detail-grid"><dt>摘要</dt><dd>${escapeHtml(meeting.summary || "暂无摘要")}</dd><dt>参与人</dt><dd>${escapeHtml((meeting.participants || []).join("、") || "未记录")}</dd><dt>原始记录</dt><dd>${(meeting.source_refs || []).map(sourceMarkup).join(" · ") || "—"}</dd></dl><h3>关联 Function</h3><div class="meeting-task-list">${meetingFunctions.map((item) => `<button class="meeting-task-button" type="button" data-function-id="${escapeHtml(item.function_id)}"><span class="task-id">${escapeHtml(idLabel(item.function_id))}</span><span class="meeting-task-title">${escapeHtml(item.title)}</span>${statusChip(item.status)}</button>`).join("") || `<div class="empty">暂无关联 Function。</div>`}</div><h3>关联 Task</h3><div class="meeting-task-list">${meetingTasks.map((task) => `<button class="meeting-task-button" type="button" data-task-id="${escapeHtml(task.task_id)}"><span class="task-id">${escapeHtml(idLabel(task.task_id))}</span><span class="meeting-task-title">${escapeHtml(task.title)}</span>${statusChip(task.status)}</button>`).join("") || `<div class="empty">暂无关联 Task。</div>`}</div>`;
        dialog.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
        bindTriggers(dialog);
        dialog.onclose = () => { if (location.hash.startsWith("#meeting-")) history.replaceState(null, "", "#human-events"); };
        if (typeof dialog.showModal === "function") dialog.showModal(); else dialog.setAttribute("open", "");
      }

      function showModule(moduleId) {
        const firstFunction = functions.find((item) => item.module_id === moduleId);
        if (!firstFunction) return;
        if (firstFunction.phase_id !== state.phase) {
          state.phase = firstFunction.phase_id;
          renderHeader(); renderPhaseSwitch(); renderBoard(); renderFunctions();
        }
        setTab("functions");
        setTimeout(() => document.getElementById(`module-${moduleId}`)?.scrollIntoView({ block: "start" }), 0);
      }

      function setTab(tabId) {
        const valid = tabs.some((tab) => tab.id === tabId) ? tabId : "dynamic";
        document.querySelectorAll(".tab").forEach((tab) => { const active = tab.dataset.tab === valid; tab.classList.toggle("active", active); tab.setAttribute("aria-selected", String(active)); });
        document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.toggle("active", panel.id === `panel-${valid}`));
        const detail = ["#task-", "#meeting-", "#function-"].some((prefix) => location.hash.startsWith(prefix));
        if (location.hash !== `#${valid}` && !detail) history.replaceState(null, "", `#${valid}`);
      }

      function routeHash() {
        const raw = location.hash.slice(1);
        if (raw.startsWith("task-")) { setTab("plan"); if (!document.getElementById("taskDialog").open) showTask(decodeURIComponent(raw.slice(5)), false); return; }
        if (raw.startsWith("function-")) { setTab("functions"); if (!document.getElementById("functionDialog").open) showFunction(decodeURIComponent(raw.slice(9)), false); return; }
        if (raw.startsWith("topic-")) { showModule(decodeURIComponent(raw.slice(6))); return; }
        if (raw.startsWith("meeting-")) { setTab("human-events"); if (!document.getElementById("meetingDialog").open) showMeeting(decodeURIComponent(raw.slice(8))); return; }
        setTab(raw || "dynamic");
      }

      function boot() {
        if (!DATA || !DATA.project) {
          document.body.innerHTML = `<div class="notice error" style="margin:30px">Project Overview 数据缺失。请先运行 <code>python3 scripts/generate_project_overview.py --write</code>。</div>`;
          return;
        }
        renderHeader(); renderPhaseSwitch(); renderTabs(); renderDynamic(); renderBoard(); renderMeetings(); renderFunctions(); renderSystemMap(); renderManual(); renderReport();
        document.getElementById("reportButton").addEventListener("click", () => { location.hash = "#report"; routeHash(); });
        window.addEventListener("hashchange", routeHash);
        routeHash();
      }
      boot();
    })();
  </script>
</body>
</html>
