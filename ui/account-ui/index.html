<!DOCTYPE html>
<html lang="en" class="material-symbols-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Intake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      id="material-symbols-font-stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;700&display=block"
      rel="stylesheet"
    />
    <script>
      (() => {
        const revealIcons = () => {
          document.documentElement.classList.remove("material-symbols-pending");
        };
        const iconFontStylesheet = document.getElementById("material-symbols-font-stylesheet");
        if (!iconFontStylesheet) {
          revealIcons();
          return;
        }
        iconFontStylesheet.addEventListener("load", revealIcons, { once: true });
        iconFontStylesheet.addEventListener("error", revealIcons, { once: true });
        if (iconFontStylesheet.sheet) {
          revealIcons();
        }
      })();
    </script>
    <link rel="stylesheet" href="/shared-ui/composer.css?v=20260519-json-codeblock-1" />
    <link rel="stylesheet" href="./styles.css?v=20260812-account-full-rerun-always-1" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script src="/shared-ui/composer.js?v=20260519-json-codeblock-1"></script>
    <script src="./app.js?v=20260812-account-full-rerun-always-1"></script>
  </body>
</html>
