<!DOCTYPE html>
<html lang="en" class="material-symbols-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Admin · Engineer Management - SupportPortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      id="material-symbols-font-stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;700&display=block"
      rel="stylesheet"
    />
    <script>
      (() => {
        let settled = false;
        const markIconsReady = () => {
          if (settled) return;
          settled = true;
          document.documentElement.classList.remove("material-symbols-pending");
          document.documentElement.classList.remove("material-symbols-failed");
          document.documentElement.classList.add("material-symbols-ready");
        };
        const markIconsFailed = () => {
          if (settled) return;
          settled = true;
          document.documentElement.classList.remove("material-symbols-pending");
          document.documentElement.classList.remove("material-symbols-ready");
          document.documentElement.classList.add("material-symbols-failed");
        };
        const stylesheet = document.getElementById("material-symbols-font-stylesheet");
        if (!stylesheet || !document.fonts || typeof document.fonts.load !== "function") {
          markIconsFailed();
          return;
        }
        const timer = window.setTimeout(markIconsFailed, 2500);
        const waitForIcons = () => {
          const fontSpec = '24px "Material Symbols Outlined"';
          const railGlyphs = "admin_panel_settings dashboard groups calendar_month confirmation_number task_alt history logout";
          document.fonts
            .load(fontSpec, railGlyphs)
            .then((faces) => {
              if (!faces.length || !document.fonts.check(fontSpec, railGlyphs)) {
                throw new Error("Material Symbols rail glyphs are unavailable");
              }
              markIconsReady();
            })
            .catch(markIconsFailed)
            .finally(() => window.clearTimeout(timer));
        };
        stylesheet.addEventListener("load", waitForIcons, { once: true });
        stylesheet.addEventListener("error", markIconsFailed, { once: true });
        if (stylesheet.sheet) {
          waitForIcons();
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260731-agent-config-hierarchy-1" />
  </head>
  <body>
    <main
      id="workspace-admin-root"
      class="assignment-app"
      aria-label="System Admin · Engineer Management operations console"
      aria-live="polite"
    >
    </main>
    <script src="./app.js?v=20260731-agent-config-hierarchy-1"></script>
  </body>
</html>
