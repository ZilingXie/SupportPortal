<!DOCTYPE html>
<html lang="en" class="material-symbols-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupportPortal Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      id="material-symbols-font-stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;700&display=block"
      rel="stylesheet"
    />
    <script>
      (() => {
        const revealIcons = () => {
          document.documentElement.classList.remove("material-symbols-pending");
        };
        const stylesheet = document.getElementById("material-symbols-font-stylesheet");
        if (!stylesheet || !document.fonts || typeof document.fonts.load !== "function") {
          revealIcons();
          return;
        }
        const timer = window.setTimeout(revealIcons, 2500);
        const waitForIcons = () => {
          document.fonts
            .load('24px "Material Symbols Outlined"')
            .then(revealIcons)
            .catch(revealIcons)
            .finally(() => window.clearTimeout(timer));
        };
        stylesheet.addEventListener("load", waitForIcons, { once: true });
        stylesheet.addEventListener("error", revealIcons, { once: true });
        if (stylesheet.sheet) {
          waitForIcons();
        }
      })();
    </script>
    <link rel="stylesheet" href="/shared-ui/composer.css?v=20260519-json-codeblock-1" />
    <link rel="stylesheet" href="./styles.css?v=20260705-workspace-logout-footer-1" />
  </head>
  <body>
    <main class="workspace-app engineer-app">
      <section id="login-screen" class="screen screen-login workspace-entry-screen">
        <div
          id="workspace-root"
          class="workspace-entry-root"
          aria-label="Choose a demo engineer for SupportPortal Workspace"
          aria-live="polite"
        >
          <noscript>Choose a demo engineer to enter SupportPortal Workspace.</noscript>
        </div>
      </section>

      <section id="engineer-screen" class="screen screen-engineer hidden">
        <aside
          id="workspace-assignment-sidebar"
          class="engineer-rail assignment-sidebar workspace-assignment-sidebar"
          aria-label="Engineer context"
        >
          <noscript>Workspace assignment context requires JavaScript.</noscript>
        </aside>

        <div class="engineer-shell problem-workspace">
          <main class="workspace-region">
            <div id="filter-controls" class="filter-controls"></div>
            <div id="workspace-region" class="workspace-content" aria-live="polite"></div>
          </main>
        </div>
      </section>
    </main>

    <script src="/shared-ui/composer.js?v=20260519-json-codeblock-1"></script>
    <script src="./app.js?v=20260705-workspace-logout-footer-1"></script>
  </body>
</html>
