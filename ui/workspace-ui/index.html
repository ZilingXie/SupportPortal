<!DOCTYPE html>
<html lang="en" class="material-symbols-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupportPortal Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      id="material-symbols-font-stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;700&display=block"
      rel="stylesheet"
    />
    <script>
      (() => {
        const revealIcons = () => {
          document.documentElement.classList.remove("material-symbols-pending");
        };
        const stylesheet = document.getElementById("material-symbols-font-stylesheet");
        if (!stylesheet || !document.fonts || typeof document.fonts.load !== "function") {
          revealIcons();
          return;
        }
        const timer = window.setTimeout(revealIcons, 2500);
        const waitForIcons = () => {
          document.fonts
            .load('24px "Material Symbols Outlined"')
            .then(revealIcons)
            .catch(revealIcons)
            .finally(() => window.clearTimeout(timer));
        };
        stylesheet.addEventListener("load", waitForIcons, { once: true });
        stylesheet.addEventListener("error", revealIcons, { once: true });
        if (stylesheet.sheet) {
          waitForIcons();
        }
      })();
    </script>
    <link rel="stylesheet" href="/shared-ui/composer.css?v=20260519-json-codeblock-1" />
    <link rel="stylesheet" href="./styles.css?v=20260704-workspace-assignment-engineer-1" />
  </head>
  <body>
    <main class="workspace-app engineer-app">
      <section id="login-screen" class="screen screen-login workspace-entry-screen">
        <div
          id="workspace-root"
          class="workspace-entry-root"
          aria-label="Choose a demo engineer for SupportPortal Workspace"
          aria-live="polite"
        >
          <noscript>Choose a demo engineer to enter SupportPortal Workspace.</noscript>
        </div>
      </section>

      <section id="engineer-screen" class="screen screen-engineer hidden">
        <aside class="engineer-rail assignment-sidebar">
          <div class="rail-brand">
            <div class="rail-brand-icon">
              <span class="material-symbols-outlined" aria-hidden="true">bolt</span>
            </div>
            <div class="rail-brand-copy">
              <span class="rail-brand-title">SupportPortal Workspace</span>
              <span class="rail-brand-subtitle">Real Engineer Cases</span>
            </div>
          </div>
          <nav id="rail-nav" class="rail-nav" aria-label="Workspace navigation"></nav>
          <div class="rail-footer">
            <div class="rail-status-card">
              <svg class="rail-status-icon realtime-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="1.8" fill="currentColor"></circle>
                <path d="M8.8 8.8C7 10.6 7 13.4 8.8 15.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
                <path d="M15.2 8.8C17 10.6 17 13.4 15.2 15.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
                <path d="M5.6 5.6C2.7 8.5 2.7 15.5 5.6 18.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
                <path d="M18.4 5.6C21.3 8.5 21.3 15.5 18.4 18.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
              </svg>
              <div class="rail-footer-copy">
                <span class="realtime-label">Realtime</span>
                <span id="ws-status" class="realtime-value">connecting...</span>
              </div>
            </div>
            <div id="header-user-controls" class="header-user-controls rail-user-controls"></div>
          </div>
        </aside>

        <div class="engineer-shell problem-workspace">
          <main class="workspace-region">
            <div id="filter-controls" class="filter-controls"></div>
            <div id="workspace-region" class="workspace-content" aria-live="polite"></div>
          </main>
        </div>
      </section>
    </main>

    <script src="/shared-ui/composer.js?v=20260519-json-codeblock-1"></script>
    <script src="./app.js?v=20260704-workspace-assignment-engineer-1"></script>
  </body>
</html>
