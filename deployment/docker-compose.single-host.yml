services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - ws_gateway
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/supportportal.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  api:
    image: ${APP_RUNTIME_IMAGE:-localhost/supportportal-app:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        APP_BUILD_REF: ${APP_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    env_file:
      - ../.env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${API_WORKERS:-2}"
    environment:
      APP_BUILD_REF: ${APP_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      RUNTIME_PROFILE: ${RUNTIME_PROFILE:-full}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.4}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-20.0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_FALLBACK_ENABLED: ${DEEPSEEK_FALLBACK_ENABLED:-true}
      INTENT_ROUTER_MODEL: ${INTENT_ROUTER_MODEL:-gpt-5.4-mini}
      INTENT_ROUTER_REASONING_EFFORT: ${INTENT_ROUTER_REASONING_EFFORT:-low}
      OPENAI_WEB_SEARCH_MODEL: ${OPENAI_WEB_SEARCH_MODEL:-gpt-5.4}
      RAG_SUFFICIENCY_JUDGE_MODEL: ${RAG_SUFFICIENCY_JUDGE_MODEL:-gpt-5.4}
      RAG_SUFFICIENCY_JUDGE_REASONING_EFFORT: ${RAG_SUFFICIENCY_JUDGE_REASONING_EFFORT:-low}
      ENGINEER_HELPER_MODEL: ${ENGINEER_HELPER_MODEL:-gpt-5.4}
      ENGINEER_HELPER_REASONING_EFFORT: ${ENGINEER_HELPER_REASONING_EFFORT:-high}
      ENGINEER_INVESTIGATION_REPLY_MODEL: ${ENGINEER_INVESTIGATION_REPLY_MODEL:-gpt-5.4}
      ENGINEER_INVESTIGATION_REPLY_REASONING_EFFORT: ${ENGINEER_INVESTIGATION_REPLY_REASONING_EFFORT:-medium}
      ENGINEER_INVESTIGATION_REPLY_TIMEOUT_SECONDS: ${ENGINEER_INVESTIGATION_REPLY_TIMEOUT_SECONDS:-20.0}
      ENGINEER_INVESTIGATION_REPLY_MAX_RETRIES: ${ENGINEER_INVESTIGATION_REPLY_MAX_RETRIES:-1}
      KNOWLEDGE_INGESTION_MODEL: ${KNOWLEDGE_INGESTION_MODEL:-gpt-5.4-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-20.0}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-1}
      PRIMARY_CHUNK_STRATEGY: ${PRIMARY_CHUNK_STRATEGY:-markdown_header_v1}
      SHADOW_CHUNK_STRATEGY: ${SHADOW_CHUNK_STRATEGY:-semantic_qwen3_v1}
      SHADOW_CHUNK_ENABLED: ${SHADOW_CHUNK_ENABLED:-true}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILLICONFLOW_KEY: ${SILLICONFLOW_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_EMBEDDING_DIMENSIONS: ${SILICONFLOW_EMBEDDING_DIMENSIONS:-1024}
      SILICONFLOW_EMBEDDING_COST_PER_1K: ${SILICONFLOW_EMBEDDING_COST_PER_1K:-0.0}
      LOCAL_KNOWLEDGE_ROOT: ${LOCAL_KNOWLEDGE_ROOT:-local_knowledge}
      TICKET_DB_DSN: ${TICKET_DB_DSN:?TICKET_DB_DSN is required}
      TICKET_DB_APPLICATION_NAME: ${TICKET_DB_APPLICATION_NAME:-supportportal-api}
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      TICKET_DB_POOL_MIN_SIZE: ${TICKET_DB_POOL_MIN_SIZE:-3}
