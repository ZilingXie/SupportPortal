      RAG_SERVICE_SHARED_TOKEN: ${RAG_SERVICE_SHARED_TOKEN:-supportportal-rag-internal}
      ASYNC_QUERY_ENABLED: ${ASYNC_QUERY_ENABLED:-true}
      ASSET_STORAGE_PROVIDER: ${ASSET_STORAGE_PROVIDER:-s3}
      ASSET_S3_BUCKET: ${ASSET_S3_BUCKET:-}
      ASSET_S3_REGION: ${ASSET_S3_REGION:-}
      ASSET_S3_PREFIX: ${ASSET_S3_PREFIX:-supportportal}
      ASSET_UPLOAD_MAX_BYTES: ${ASSET_UPLOAD_MAX_BYTES:-20971520}
      ASSET_ALLOWED_EXTENSIONS: ${ASSET_ALLOWED_EXTENSIONS:-.log,.err,.txt}
      ASSET_PRESIGN_TTL_SECONDS: ${ASSET_PRESIGN_TTL_SECONDS:-300}
      ASSET_S3_KMS_KEY_ID: ${ASSET_S3_KMS_KEY_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-${ASSET_S3_REGION:-}}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${ASSET_S3_REGION:-}}
      AWS_PROFILE: ${AWS_PROFILE:-}
    depends_on:
      redis:
        condition: service_healthy
      rag_api:
        condition: service_started
    restart: unless-stopped

