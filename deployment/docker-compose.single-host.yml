services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - ws_gateway
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/supportportal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/runtime:/etc/nginx/runtime:ro
    networks:
      - default
      - automation_edge
    restart: unless-stopped

  route_staging:
    profiles: ["automation"]
    image: ${ROUTE_STAGING_IMAGE:-localhost/supportportal-route-staging:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile.automation
      args:
        AUTOMATION_IMAGE_ROLE: route
        APP_BUILD_REF: ${ROUTE_STAGING_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${ROUTE_STAGING_BUILD_TIME:-}
    command: ["uvicorn", "backend.route_service:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      AUTOMATION_ENVIRONMENT: staging
      ROUTE_SERVICE_TOKEN: ${ROUTE_STAGING_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTER_MODE: ${ACCOUNT_ROUTER_MODE:-layered}
      APP_BUILD_REF: ${ROUTE_STAGING_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${ROUTE_STAGING_BUILD_TIME:-}
      RUNTIME_PROFILE: route
    expose: ["8100"]
    networks: [automation_internal_staging]
    restart: unless-stopped

  route_preproduction:
    profiles: ["automation"]
    image: ${ROUTE_PREPRODUCTION_IMAGE:-localhost/supportportal-route-preproduction:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile.automation
      args:
        AUTOMATION_IMAGE_ROLE: route
        APP_BUILD_REF: ${ROUTE_PREPRODUCTION_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${ROUTE_PREPRODUCTION_BUILD_TIME:-}
    command: ["uvicorn", "backend.route_service:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      AUTOMATION_ENVIRONMENT: preproduction
      ROUTE_SERVICE_TOKEN: ${ROUTE_PREPRODUCTION_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTER_MODE: ${ACCOUNT_ROUTER_MODE:-layered}
      APP_BUILD_REF: ${ROUTE_PREPRODUCTION_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${ROUTE_PREPRODUCTION_BUILD_TIME:-}
      RUNTIME_PROFILE: route
    expose: ["8100"]
    networks: [automation_internal_preproduction]
    restart: unless-stopped

  route_production:
    profiles: ["automation"]
    image: ${ROUTE_PRODUCTION_IMAGE:-localhost/supportportal-route-production:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile.automation
      args:
        AUTOMATION_IMAGE_ROLE: route
        APP_BUILD_REF: ${ROUTE_PRODUCTION_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${ROUTE_PRODUCTION_BUILD_TIME:-}
    command: ["uvicorn", "backend.route_service:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      AUTOMATION_ENVIRONMENT: production
      ROUTE_SERVICE_TOKEN: ${ROUTE_PRODUCTION_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTER_MODE: ${ACCOUNT_ROUTER_MODE:-layered}
      APP_BUILD_REF: ${ROUTE_PRODUCTION_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${ROUTE_PRODUCTION_BUILD_TIME:-}
      RUNTIME_PROFILE: route
    expose: ["8100"]
    networks: [automation_internal_production]
    restart: unless-stopped

  automation_staging:
    profiles: ["automation"]
    image: ${AUTOMATION_STAGING_IMAGE:-localhost/supportportal-automation-staging:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile.automation
      args:
        AUTOMATION_IMAGE_ROLE: automation
        APP_BUILD_REF: ${AUTOMATION_STAGING_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${AUTOMATION_STAGING_BUILD_TIME:-}
    command: ["uvicorn", "backend.automation_runtime:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      AUTOMATION_ENVIRONMENT: staging
      AUTOMATION_DB_DSN: ${AUTOMATION_STAGING_DB_DSN:-}
      AUTOMATION_DB_RESOURCE_ID: staging
      AUTOMATION_DB_SCHEMA: ${AUTOMATION_STAGING_DB_SCHEMA:-supportportal_staging}
      AUTOMATION_DB_TABLE: ${AUTOMATION_STAGING_DB_TABLE:-automation_executions_staging}
      AUTOMATION_RUNTIME_ALLOW_MEMORY: ${AUTOMATION_RUNTIME_ALLOW_MEMORY:-0}
      AUTOMATION_RUNTIME_REQUIRE_RESOURCES: "1"
      AUTOMATION_ZENDESK_SIDE_EFFECTS_ENABLED: "0"
      AUTOMATION_REDIS_URL: redis://automation_redis_staging:6379/0
      AUTOMATION_QUEUE_NAME: ${AUTOMATION_STAGING_QUEUE:-automation.staging}
      AUTOMATION_EVENT_CHANNEL: ${AUTOMATION_STAGING_EVENT_CHANNEL:-automation.events.staging}
      AUTOMATION_RESOURCE_ID: staging
      n8n_request_token: ${n8n_request_token:-}
      ROUTE_SERVICE_URL: http://route_staging:8100
      ROUTE_SERVICE_TOKEN: ${ROUTE_STAGING_SERVICE_TOKEN:-}
      APP_BUILD_REF: ${AUTOMATION_STAGING_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${AUTOMATION_STAGING_BUILD_TIME:-}
    expose: ["8000"]
    networks: [automation_edge, automation_internal_staging]
    depends_on:
      route_staging:
        condition: service_started
      automation_redis_staging:
        condition: service_healthy
    restart: unless-stopped

  automation_preproduction:
    profiles: ["automation"]
    image: ${AUTOMATION_PREPRODUCTION_IMAGE:-localhost/supportportal-automation-preproduction:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile.automation
      args:
        AUTOMATION_IMAGE_ROLE: automation
        APP_BUILD_REF: ${AUTOMATION_PREPRODUCTION_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${AUTOMATION_PREPRODUCTION_BUILD_TIME:-}
    command: ["uvicorn", "backend.automation_runtime:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      AUTOMATION_ENVIRONMENT: preproduction
      AUTOMATION_DB_DSN: ${AUTOMATION_PREPRODUCTION_DB_DSN:-}
      AUTOMATION_DB_RESOURCE_ID: preproduction
      AUTOMATION_DB_SCHEMA: ${AUTOMATION_PREPRODUCTION_DB_SCHEMA:-supportportal_preproduction}
      AUTOMATION_DB_TABLE: ${AUTOMATION_PREPRODUCTION_DB_TABLE:-automation_executions_preproduction}
      AUTOMATION_RUNTIME_ALLOW_MEMORY: ${AUTOMATION_RUNTIME_ALLOW_MEMORY:-0}
      AUTOMATION_RUNTIME_REQUIRE_RESOURCES: "1"
      PREPRODUCTION_ZENDESK_TICKET_ALLOWLIST: ${PREPRODUCTION_ZENDESK_TICKET_ALLOWLIST:-}
      AUTOMATION_ZENDESK_SIDE_EFFECTS_ENABLED: ${PREPRODUCTION_ZENDESK_SIDE_EFFECTS_ENABLED:-0}
      AUTOMATION_TARGET_TICKET_STATUS: ${PREPRODUCTION_TARGET_TICKET_STATUS:-}
      AUTOMATION_REDIS_URL: redis://automation_redis_preproduction:6379/0
      AUTOMATION_QUEUE_NAME: ${AUTOMATION_PREPRODUCTION_QUEUE:-automation.preproduction}
      AUTOMATION_EVENT_CHANNEL: ${AUTOMATION_PREPRODUCTION_EVENT_CHANNEL:-automation.events.preproduction}
      AUTOMATION_RESOURCE_ID: preproduction
      n8n_request_token: ${n8n_request_token:-}
      zendesk_basic_auth: ${zendesk_basic_auth:-}
      ZENDESK_AI_ASSIGNEE_EMAIL: ${ZENDESK_AI_ASSIGNEE_EMAIL:-}
      ROUTE_SERVICE_URL: http://route_preproduction:8100
      ROUTE_SERVICE_TOKEN: ${ROUTE_PREPRODUCTION_SERVICE_TOKEN:-}
      APP_BUILD_REF: ${AUTOMATION_PREPRODUCTION_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${AUTOMATION_PREPRODUCTION_BUILD_TIME:-}
    expose: ["8000"]
    networks: [automation_edge, automation_internal_preproduction]
    depends_on:
      route_preproduction:
        condition: service_started
      automation_redis_preproduction:
        condition: service_healthy
    restart: unless-stopped

  automation_production:
    profiles: ["automation"]
    image: ${AUTOMATION_PRODUCTION_IMAGE:-localhost/supportportal-automation-production:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile.automation
      args:
        AUTOMATION_IMAGE_ROLE: production
        APP_BUILD_REF: ${AUTOMATION_PRODUCTION_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${AUTOMATION_PRODUCTION_BUILD_TIME:-}
    command: ["uvicorn", "backend.automation_production_runtime:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      AUTOMATION_ENVIRONMENT: production
      AUTOMATION_DB_DSN: ${AUTOMATION_PRODUCTION_DB_DSN:-}
      AUTOMATION_DB_RESOURCE_ID: production
      AUTOMATION_DB_SCHEMA: ${AUTOMATION_PRODUCTION_DB_SCHEMA:-supportportal_production}
      AUTOMATION_DB_TABLE: ${AUTOMATION_PRODUCTION_DB_TABLE:-automation_executions_production}
      AUTOMATION_RUNTIME_ALLOW_MEMORY: ${AUTOMATION_RUNTIME_ALLOW_MEMORY:-0}
      AUTOMATION_RUNTIME_REQUIRE_RESOURCES: "1"
      AUTOMATION_ZENDESK_SIDE_EFFECTS_ENABLED: ${PRODUCTION_ZENDESK_SIDE_EFFECTS_ENABLED:-0}
      AUTOMATION_TARGET_TICKET_STATUS: ${PRODUCTION_TARGET_TICKET_STATUS:-}
      AUTOMATION_REDIS_URL: redis://automation_redis_production:6379/0
      AUTOMATION_QUEUE_NAME: ${AUTOMATION_PRODUCTION_QUEUE:-automation.production}
      AUTOMATION_EVENT_CHANNEL: ${AUTOMATION_PRODUCTION_EVENT_CHANNEL:-automation.events.production}
      AUTOMATION_RESOURCE_ID: production
      n8n_request_token: ${n8n_request_token:-}
      zendesk_basic_auth: ${zendesk_basic_auth:-}
      ZENDESK_AI_ASSIGNEE_EMAIL: ${ZENDESK_AI_ASSIGNEE_EMAIL:-}
      # Parity pipeline (p2-109 Phase B): account-case repository, third
      # internal-email namespace, LLM field extraction, Graph handoff email.
      TICKET_DB_DSN: ${AUTOMATION_PRODUCTION_DB_DSN:-${PRODUCTION_TICKET_DB_DSN:-}}
      TICKET_DB_SCHEMA: ${AUTOMATION_PRODUCTION_DB_SCHEMA:-supportportal_production}
      TICKET_DB_APPLICATION_NAME: supportportal-automation-production
      INTERNAL_EMAIL_SUBJECT_NAMESPACE: "[automation]"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HTTP_PROXY: ${SUPPORTPORTAL_HTTP_PROXY:-}
      HTTPS_PROXY: ${SUPPORTPORTAL_HTTPS_PROXY:-}
      NO_PROXY: ${SUPPORTPORTAL_NO_PROXY:-localhost,127.0.0.1,route_production}
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTE_TIMEOUT_SECONDS: ${ACCOUNT_ROUTE_TIMEOUT_SECONDS:-120}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_FALLBACK_ENABLED: ${DEEPSEEK_FALLBACK_ENABLED:-true}
      BILLING_AUTOMATION_GRAPH_TENANT_ID: ${BILLING_AUTOMATION_GRAPH_TENANT_ID:-}
      BILLING_AUTOMATION_GRAPH_CLIENT_ID: ${BILLING_AUTOMATION_GRAPH_CLIENT_ID:-}
      BILLING_AUTOMATION_GRAPH_CLIENT_SECRET: ${BILLING_AUTOMATION_GRAPH_CLIENT_SECRET:-}
      BILLING_AUTOMATION_GRAPH_USERNAME: ${BILLING_AUTOMATION_GRAPH_USERNAME:-}
      BILLING_AUTOMATION_GRAPH_TOKEN_CACHE: ${BILLING_AUTOMATION_GRAPH_TOKEN_CACHE:-.msgraph/billing-automation-token.json}
      RAG_SERVICE_URL: ${AUTOMATION_PRODUCTION_RAG_SERVICE_URL:-}
      RAG_SERVICE_TIMEOUT_SECONDS: ${RAG_SERVICE_TIMEOUT_SECONDS:-45.0}
      RAG_SERVICE_SHARED_TOKEN: ${RAG_SERVICE_SHARED_TOKEN:-supportportal-rag-internal}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      ROUTE_SERVICE_URL: http://route_production:8100
      ROUTE_SERVICE_TOKEN: ${ROUTE_PRODUCTION_SERVICE_TOKEN:-}
      APP_BUILD_REF: ${AUTOMATION_PRODUCTION_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${AUTOMATION_PRODUCTION_BUILD_TIME:-}
    expose: ["8000"]
    networks: [automation_edge, automation_internal_production]
    depends_on:
      route_production:
        condition: service_started
      automation_redis_production:
        condition: service_healthy
    restart: unless-stopped

  # Parity worker for the /automation/production replacement of /production.
  # Runs the full app image (the production automation image physically
  # excludes backend.worker) against the split production schema, with queue,
  # event channel and internal-email namespace isolated from the legacy
  # production stack. Schema bootstrap is owned by
  # deployment/bootstrap_automation_production_schema.sh (migration DSN),
  # hence RUNTIME_SCHEMA_MODE=check fail-fast startup.
  automation_production_worker:
    profiles: ["automation"]
    image: ${APP_RUNTIME_IMAGE:-localhost/supportportal-app:unknown}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ../.msgraph:/app/.msgraph
    command:
      - python
      - -m
      - backend.worker
    environment:
      APP_BUILD_REF: ${APP_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      PROMPT_RELEASE_ID: ${PROMPT_RELEASE_ID:-}
      PROMPT_RELEASE_REQUIRED: ${PROMPT_RELEASE_REQUIRED:-false}
      PROMPT_RUNTIME_SERVICE: automation_production_worker
      RUNTIME_PROFILE: ${RUNTIME_PROFILE:-full}
      RUNTIME_SCHEMA_MODE: check
      INTERNAL_EMAIL_SUBJECT_NAMESPACE: "[automation]"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HTTP_PROXY: ${SUPPORTPORTAL_HTTP_PROXY:-}
      HTTPS_PROXY: ${SUPPORTPORTAL_HTTPS_PROXY:-}
      NO_PROXY: ${SUPPORTPORTAL_NO_PROXY:-localhost,127.0.0.1,automation_redis_production}
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTE_TIMEOUT_SECONDS: ${ACCOUNT_ROUTE_TIMEOUT_SECONDS:-120}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_FALLBACK_ENABLED: ${DEEPSEEK_FALLBACK_ENABLED:-true}
      TICKET_DB_DSN: ${AUTOMATION_PRODUCTION_DB_DSN:-${PRODUCTION_TICKET_DB_DSN:-}}
      TICKET_DB_APPLICATION_NAME: supportportal-automation-production-worker
      TICKET_DB_SCHEMA: ${AUTOMATION_PRODUCTION_DB_SCHEMA:-supportportal_production}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      TICKET_DB_POOL_MIN_SIZE: ${TICKET_DB_POOL_MIN_SIZE:-1}
      TICKET_DB_POOL_MAX_SIZE: ${TICKET_DB_POOL_MAX_SIZE:-2}
      TICKET_DB_POOL_TIMEOUT_SECONDS: ${TICKET_DB_POOL_TIMEOUT_SECONDS:-15}
      TICKET_DB_POOL_MAX_LIFETIME_SECONDS: ${TICKET_DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      TICKET_DB_POOL_MAX_IDLE_SECONDS: ${TICKET_DB_POOL_MAX_IDLE_SECONDS:-300}
      PGVECTOR_DSN: ${PGVECTOR_DSN:?PGVECTOR_DSN is required}
      PGVECTOR_SCHEMA: ${AUTOMATION_PRODUCTION_DB_SCHEMA:-supportportal_production}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_m3_1024}
      REDIS_URL: redis://automation_redis_production:6379/0
      EVENT_BUS_CHANNEL: support.events.automation.production
      TICKET_QUERY_QUEUE_NAME: support.ticket_queries.automation_production
      TICKET_AUX_QUEUE_NAME: support.ticket_aux.automation_production
      WORKER_TASK_TYPES: ticket_message_sentiment
      WORKER_CONCURRENCY: ${WORKER_AUX_CONCURRENCY:-1}
      ACCOUNT_REPLY_POLLER_ENABLED: "true"
      ACCOUNT_REPLY_LEGACY_POLLER_ENABLED: "true"
      ACCOUNT_DEFAULT_PROCESSING_PROFILE: production
      ACCOUNT_REPLY_POLL_INTERVAL_SECONDS: ${ACCOUNT_REPLY_POLL_INTERVAL_SECONDS:-2}
      ACCOUNT_SLACK_N8N_WEBHOOK_URL: ${PRODUCTION_ACCOUNT_SLACK_N8N_WEBHOOK_URL:-}
      ACCOUNT_SLACK_N8N_STATUS_URL: ${PRODUCTION_ACCOUNT_SLACK_N8N_STATUS_URL:-}
      ACCOUNT_SLACK_N8N_TIMEOUT_SECONDS: ${PRODUCTION_ACCOUNT_SLACK_N8N_TIMEOUT_SECONDS:-15}
      ENGINEER_SLACK_ACCESS_TOKEN: ${PRODUCTION_ENGINEER_SLACK_ACCESS_TOKEN:-}
      ENGINEER_SLACK_TEAM_ID: ${PRODUCTION_ENGINEER_SLACK_TEAM_ID:-}
      ENGINEER_SLACK_CHANNEL_ID: ${PRODUCTION_ENGINEER_SLACK_CHANNEL_ID:-}
      ENGINEER_SLACK_TIMEOUT_SECONDS: ${PRODUCTION_ENGINEER_SLACK_TIMEOUT_SECONDS:-15}
      ENGINEER_ASSIGNMENT_POLLER_ENABLED: "false"
      n8n_request_token: ${n8n_request_token:-}
      zendesk_basic_auth: ${zendesk_basic_auth:-}
      ZENDESK_AI_ASSIGNEE_EMAIL: ${ZENDESK_AI_ASSIGNEE_EMAIL:-}
      ZENDESK_FRAUD_REVIEW_ASSIGNEE_ID: ${ZENDESK_FRAUD_REVIEW_ASSIGNEE_ID:-}
      AUTOMATION_PERSONA_MODEL: ${AUTOMATION_PERSONA_MODEL:-gpt-5.6-luna}
      AUTOMATION_PERSONA_REASONING_EFFORT: ${AUTOMATION_PERSONA_REASONING_EFFORT:-low}
      AUTOMATION_PERSONA_TEMPERATURE: ${AUTOMATION_PERSONA_TEMPERATURE:-0.4}
      AUTOMATION_PERSONA_TIMEOUT_SECONDS: ${AUTOMATION_PERSONA_TIMEOUT_SECONDS:-30}
      AUTOMATION_PERSONA_MAX_RETRIES: ${AUTOMATION_PERSONA_MAX_RETRIES:-1}
      ENABLEMENT_COMPLETION_CLASSIFIER_ENABLED: ${ENABLEMENT_COMPLETION_CLASSIFIER_ENABLED:-true}
      ENABLEMENT_COMPLETION_CLASSIFIER_MODEL: ${ENABLEMENT_COMPLETION_CLASSIFIER_MODEL:-gpt-5.6-luna}
      ENABLEMENT_COMPLETION_CLASSIFIER_REASONING_EFFORT: ${ENABLEMENT_COMPLETION_CLASSIFIER_REASONING_EFFORT:-low}
      ENABLEMENT_COMPLETION_CLASSIFIER_TEMPERATURE: ${ENABLEMENT_COMPLETION_CLASSIFIER_TEMPERATURE:-0.0}
      ENABLEMENT_COMPLETION_CLASSIFIER_TIMEOUT_SECONDS: ${ENABLEMENT_COMPLETION_CLASSIFIER_TIMEOUT_SECONDS:-20}
      ENABLEMENT_COMPLETION_CLASSIFIER_MAX_RETRIES: ${ENABLEMENT_COMPLETION_CLASSIFIER_MAX_RETRIES:-1}
      AUTOMATION_REPLY_POLL_ENABLED: ${AUTOMATION_PRODUCTION_REPLY_POLL_ENABLED:-false}
      AUTOMATION_REPLY_POLL_INTERVAL_SECONDS: ${AUTOMATION_REPLY_POLL_INTERVAL_SECONDS:-}
      AUTOMATION_REPLY_POLL_MAX_MESSAGES: ${AUTOMATION_REPLY_POLL_MAX_MESSAGES:-}
      BILLING_AUTOMATION_REPLY_POLL_ENABLED: ${BILLING_AUTOMATION_REPLY_POLL_ENABLED:-false}
      BILLING_AUTOMATION_GRAPH_TENANT_ID: ${BILLING_AUTOMATION_GRAPH_TENANT_ID:-}
      BILLING_AUTOMATION_GRAPH_CLIENT_ID: ${BILLING_AUTOMATION_GRAPH_CLIENT_ID:-}
      BILLING_AUTOMATION_GRAPH_CLIENT_SECRET: ${BILLING_AUTOMATION_GRAPH_CLIENT_SECRET:-}
      BILLING_AUTOMATION_GRAPH_USERNAME: ${BILLING_AUTOMATION_GRAPH_USERNAME:-}
      BILLING_AUTOMATION_GRAPH_TOKEN_CACHE: ${BILLING_AUTOMATION_GRAPH_TOKEN_CACHE:-.msgraph/billing-automation-token.json}
      RAG_SERVICE_URL: ${AUTOMATION_PRODUCTION_RAG_SERVICE_URL:-}
      RAG_SERVICE_TIMEOUT_SECONDS: ${RAG_SERVICE_TIMEOUT_SECONDS:-45.0}
      RAG_SERVICE_SHARED_TOKEN: ${RAG_SERVICE_SHARED_TOKEN:-supportportal-rag-internal}
      SENTIMENT_PROVIDER: ${WORKER_SENTIMENT_PROVIDER:-legacy}
      SENTIMENT_MODEL_ID: ${SENTIMENT_MODEL_ID:-j-hartmann/emotion-english-distilroberta-base}
      SENTIMENT_MIN_CONFIDENCE: ${SENTIMENT_MIN_CONFIDENCE:-0.45}
    networks: [automation_internal_production]
    depends_on:
      automation_redis_production:
        condition: service_healthy
    restart: unless-stopped

  automation_redis_staging:
    profiles: ["automation"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - automation_redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [automation_internal_staging]
    restart: unless-stopped

  automation_redis_preproduction:
    profiles: ["automation"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - automation_redis_preproduction_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [automation_internal_preproduction]
    restart: unless-stopped

  automation_redis_production:
    profiles: ["automation"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - automation_redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [automation_internal_production]
    restart: unless-stopped

  api:
    image: ${APP_RUNTIME_IMAGE:-localhost/supportportal-app:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        APP_BUILD_REF: ${APP_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    env_file:
      - ../.env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
