services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - ws_gateway
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/supportportal.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  api:
    image: localhost/supportportal-app:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${API_WORKERS:-1}"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1}
      OPENAI_EMOTION_REPLY_MODEL: ${OPENAI_EMOTION_REPLY_MODEL:-gpt-4o-mini}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-20.0}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-BAAI/bge-large-en-v1.5}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-20.0}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-1}
      PRIMARY_CHUNK_STRATEGY: ${PRIMARY_CHUNK_STRATEGY:-markdown_header_v1}
      SHADOW_CHUNK_STRATEGY: ${SHADOW_CHUNK_STRATEGY:-semantic_qwen3_v1}
      SHADOW_CHUNK_ENABLED: ${SHADOW_CHUNK_ENABLED:-true}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILLICONFLOW_KEY: ${SILLICONFLOW_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_EMBEDDING_DIMENSIONS: ${SILICONFLOW_EMBEDDING_DIMENSIONS:-1024}
      SILICONFLOW_EMBEDDING_COST_PER_1K: ${SILICONFLOW_EMBEDDING_COST_PER_1K:-0.0}
      LOCAL_KNOWLEDGE_ROOT: ${LOCAL_KNOWLEDGE_ROOT:-local_knowledge}
      EMOTION_REPLY_TIMEOUT_SECONDS: ${EMOTION_REPLY_TIMEOUT_SECONDS:-2.0}
      TICKET_DB_DSN: ${TICKET_DB_DSN:?TICKET_DB_DSN is required}
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-supportportal}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_large_en_v1_5_1024}
      PGVECTOR_DIM: ${PGVECTOR_DIM:-1024}
      SENTIMENT_PROVIDER: ${SENTIMENT_PROVIDER:-model}
      SENTIMENT_MODEL_ID: ${SENTIMENT_MODEL_ID:-j-hartmann/emotion-english-distilroberta-base}
      SENTIMENT_MIN_CONFIDENCE: ${SENTIMENT_MIN_CONFIDENCE:-0.45}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_CHANNEL: ${EVENT_BUS_CHANNEL:-support.events}
      TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-support.tasks}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag_api:8020}
      RAG_SERVICE_TIMEOUT_SECONDS: ${RAG_SERVICE_TIMEOUT_SECONDS:-45.0}
      RAG_SERVICE_SHARED_TOKEN: ${RAG_SERVICE_SHARED_TOKEN:-supportportal-rag-internal}
      ASYNC_QUERY_ENABLED: ${ASYNC_QUERY_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      rag_api:
        condition: service_started
    restart: unless-stopped

  rag_api:
    image: localhost/supportportal-app:latest
    env_file:
      - ../.env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - uvicorn
      - backend.rag_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8020"
      - --workers
      - "${RAG_API_WORKERS:-1}"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${RAG_OPENAI_CHAT_MODEL:-gpt-4.1}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-20.0}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-BAAI/bge-large-en-v1.5}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-20.0}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-1}
      PRIMARY_CHUNK_STRATEGY: ${PRIMARY_CHUNK_STRATEGY:-markdown_header_v1}
      SHADOW_CHUNK_STRATEGY: ${SHADOW_CHUNK_STRATEGY:-semantic_qwen3_v1}
      SHADOW_CHUNK_ENABLED: ${SHADOW_CHUNK_ENABLED:-true}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILLICONFLOW_KEY: ${SILLICONFLOW_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_EMBEDDING_DIMENSIONS: ${SILICONFLOW_EMBEDDING_DIMENSIONS:-1024}
      SILICONFLOW_EMBEDDING_COST_PER_1K: ${SILICONFLOW_EMBEDDING_COST_PER_1K:-0.0}
      LOCAL_KNOWLEDGE_ROOT: ${LOCAL_KNOWLEDGE_ROOT:-local_knowledge}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_VECTOR_CANDIDATE_K: ${RAG_VECTOR_CANDIDATE_K:-60}
      RAG_BM25_CANDIDATE_K: ${RAG_BM25_CANDIDATE_K:-60}
      RAG_FUSION_CANDIDATE_K: ${RAG_FUSION_CANDIDATE_K:-48}
      RAG_RERANK_TOP_N: ${RAG_RERANK_TOP_N:-24}
      RAG_BM25_K1: ${RAG_BM25_K1:-1.2}
      RAG_BM25_B: ${RAG_BM25_B:-0.75}
      RAG_RERANK_PROVIDER: ${RAG_RERANK_PROVIDER:-siliconflow}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_RERANK_API_KEY: ${RAG_RERANK_API_KEY:-}
      RAG_RERANK_BASE_URL: ${RAG_RERANK_BASE_URL:-}
      RAG_RERANK_TIMEOUT_SECONDS: ${RAG_RERANK_TIMEOUT_SECONDS:-10}
      RAG_RERANK_MAX_RETRIES: ${RAG_RERANK_MAX_RETRIES:-1}
      RAG_REQUEST_TIMEOUT_SECONDS: ${RAG_REQUEST_TIMEOUT_SECONDS:-20.0}
      RAG_OPENAI_MAX_RETRIES: ${RAG_OPENAI_MAX_RETRIES:-1}
      PGVECTOR_DSN: ${PGVECTOR_DSN:?PGVECTOR_DSN is required}
      PGVECTOR_CONNECT_TIMEOUT: ${PGVECTOR_CONNECT_TIMEOUT:-10}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_large_en_v1_5_1024}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-supportportal}
      PGVECTOR_DIM: ${PGVECTOR_DIM:-1024}
      TICKET_DB_DSN: ${TICKET_DB_DSN:?TICKET_DB_DSN is required}
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_CHANNEL: ${EVENT_BUS_CHANNEL:-support.events}
      RAG_QUEUE_NAME: ${RAG_QUEUE_NAME:-support.rag.tasks}
      RAG_SERVICE_SHARED_TOKEN: ${RAG_SERVICE_SHARED_TOKEN:-supportportal-rag-internal}
      KNOWLEDGE_OFFICIAL_MAX_BYTES: ${KNOWLEDGE_OFFICIAL_MAX_BYTES:-5242880}
      KNOWLEDGE_ARTICLE_MAX_CHARS: ${KNOWLEDGE_ARTICLE_MAX_CHARS:-120000}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  rag_worker:
    image: localhost/supportportal-app:latest
    env_file:
      - ../.env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - python
      - -m
      - backend.rag_worker
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${RAG_OPENAI_CHAT_MODEL:-gpt-4.1}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-20.0}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-BAAI/bge-large-en-v1.5}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-20.0}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-1}
      PRIMARY_CHUNK_STRATEGY: ${PRIMARY_CHUNK_STRATEGY:-markdown_header_v1}
      SHADOW_CHUNK_STRATEGY: ${SHADOW_CHUNK_STRATEGY:-semantic_qwen3_v1}
      SHADOW_CHUNK_ENABLED: ${SHADOW_CHUNK_ENABLED:-true}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILLICONFLOW_KEY: ${SILLICONFLOW_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_EMBEDDING_DIMENSIONS: ${SILICONFLOW_EMBEDDING_DIMENSIONS:-1024}
      SILICONFLOW_EMBEDDING_COST_PER_1K: ${SILICONFLOW_EMBEDDING_COST_PER_1K:-0.0}
      PGVECTOR_DSN: ${PGVECTOR_DSN:?PGVECTOR_DSN is required}
      PGVECTOR_CONNECT_TIMEOUT: ${PGVECTOR_CONNECT_TIMEOUT:-10}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_large_en_v1_5_1024}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-supportportal}
      PGVECTOR_DIM: ${PGVECTOR_DIM:-1024}
      TICKET_DB_DSN: ${TICKET_DB_DSN:?TICKET_DB_DSN is required}
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_CHANNEL: ${EVENT_BUS_CHANNEL:-support.events}
      RAG_QUEUE_NAME: ${RAG_QUEUE_NAME:-support.rag.tasks}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ws_gateway:
    image: localhost/supportportal-app:latest
    command:
      - uvicorn
      - backend.ws_gateway:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
      - --workers
      - "1"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_CHANNEL: ${EVENT_BUS_CHANNEL:-support.events}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: localhost/supportportal-app:latest
    env_file:
      - ../.env
    command:
      - python
      - -m
      - backend.worker
    environment:
      TICKET_DB_DSN: ${TICKET_DB_DSN:?TICKET_DB_DSN is required}
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-supportportal}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_large_en_v1_5_1024}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_CHANNEL: ${EVENT_BUS_CHANNEL:-support.events}
      TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-support.tasks}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag_api:8020}
      RAG_SERVICE_TIMEOUT_SECONDS: ${RAG_SERVICE_TIMEOUT_SECONDS:-45.0}
      RAG_SERVICE_SHARED_TOKEN: ${RAG_SERVICE_SHARED_TOKEN:-supportportal-rag-internal}
    depends_on:
      redis:
        condition: service_healthy
      rag_api:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  redis_data:
  huggingface_cache:
