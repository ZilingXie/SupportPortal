      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_FALLBACK_ENABLED: ${DEEPSEEK_FALLBACK_ENABLED:-true}
      TICKET_DB_DSN: ${PRODUCTION_TICKET_DB_DSN:-}
      TICKET_DB_APPLICATION_NAME: supportportal-worker-query-production
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      TICKET_DB_POOL_MIN_SIZE: ${TICKET_DB_POOL_MIN_SIZE:-2}
      TICKET_DB_POOL_MAX_SIZE: ${TICKET_DB_POOL_MAX_SIZE:-4}
      TICKET_DB_POOL_TIMEOUT_SECONDS: ${TICKET_DB_POOL_TIMEOUT_SECONDS:-15}
      TICKET_DB_POOL_MAX_LIFETIME_SECONDS: ${TICKET_DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      TICKET_DB_POOL_MAX_IDLE_SECONDS: ${TICKET_DB_POOL_MAX_IDLE_SECONDS:-300}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-supportportal}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_m3_1024}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_CHANNEL: support.events.production
      TICKET_QUERY_QUEUE_NAME: support.ticket_queries.production
      TICKET_AUX_QUEUE_NAME: support.ticket_aux.production
      WORKER_TASK_TYPES: ${WORKER_QUERY_TASK_TYPES:-ticket_query}
      ACCOUNT_REPLY_POLLER_ENABLED: "false"
      ACCOUNT_REPLY_LEGACY_POLLER_ENABLED: "false"
      AUTOMATION_REPLY_POLL_ENABLED: "false"
      BILLING_AUTOMATION_REPLY_POLL_ENABLED: "false"
      WORKER_CONCURRENCY: ${WORKER_QUERY_CONCURRENCY:-2}
      ENGINEER_ASSIGNMENT_POLLER_ENABLED: "false"
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag_api:8020}
      RAG_SERVICE_TIMEOUT_SECONDS: ${RAG_SERVICE_TIMEOUT_SECONDS:-45.0}
      RAG_SERVICE_SHARED_TOKEN: ${RAG_SERVICE_SHARED_TOKEN:-supportportal-rag-internal}
      SENTIMENT_PROVIDER: ${WORKER_SENTIMENT_PROVIDER:-legacy}
      SENTIMENT_MODEL_ID: ${SENTIMENT_MODEL_ID:-j-hartmann/emotion-english-distilroberta-base}
      SENTIMENT_MIN_CONFIDENCE: ${SENTIMENT_MIN_CONFIDENCE:-0.45}
    depends_on:
      redis:
        condition: service_healthy
      rag_api:
        condition: service_started
    restart: unless-stopped

  worker_aux_production:
    profiles:
      - production
    image: ${APP_RUNTIME_IMAGE:-localhost/supportportal-app:unknown}
    env_file:
      - ../.env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ../.msgraph:/app/.msgraph
    command:
      - python
      - -m
      - backend.worker
    environment:
      APP_BUILD_REF: ${APP_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      PROMPT_RELEASE_ID: ${PROMPT_RELEASE_ID:-}
      INTERNAL_EMAIL_SUBJECT_NAMESPACE: ""
      PROMPT_RELEASE_REQUIRED: ${PROMPT_RELEASE_REQUIRED:-false}
      PROMPT_RUNTIME_SERVICE: worker_aux_production
      RUNTIME_PROFILE: ${RUNTIME_PROFILE:-full}
      RUNTIME_SCHEMA_MODE: ${RUNTIME_SCHEMA_MODE:-bootstrap}
      AUTOMATION_PRODUCTION_DB_MIGRATION_DSN: ""
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HTTP_PROXY: ${SUPPORTPORTAL_HTTP_PROXY:-}
      HTTPS_PROXY: ${SUPPORTPORTAL_HTTPS_PROXY:-}
      NO_PROXY: ${SUPPORTPORTAL_NO_PROXY:-localhost,127.0.0.1,api,rag_api,redis}
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTE_TIMEOUT_SECONDS: ${ACCOUNT_ROUTE_TIMEOUT_SECONDS:-120}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_FALLBACK_ENABLED: ${DEEPSEEK_FALLBACK_ENABLED:-true}
      TICKET_DB_DSN: ${PRODUCTION_TICKET_DB_DSN:-}
      TICKET_DB_APPLICATION_NAME: supportportal-worker-aux-production
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      TICKET_DB_POOL_MIN_SIZE: ${TICKET_DB_POOL_MIN_SIZE:-1}
      TICKET_DB_POOL_MAX_SIZE: ${TICKET_DB_POOL_MAX_SIZE:-2}
      TICKET_DB_POOL_TIMEOUT_SECONDS: ${TICKET_DB_POOL_TIMEOUT_SECONDS:-15}
      TICKET_DB_POOL_MAX_LIFETIME_SECONDS: ${TICKET_DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      TICKET_DB_POOL_MAX_IDLE_SECONDS: ${TICKET_DB_POOL_MAX_IDLE_SECONDS:-300}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-supportportal}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_m3_1024}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BUS_CHANNEL: support.events.production
      TICKET_QUERY_QUEUE_NAME: support.ticket_queries.production
      TICKET_AUX_QUEUE_NAME: support.ticket_aux.production
      WORKER_TASK_TYPES: ${WORKER_AUX_TASK_TYPES:-ticket_message_sentiment}
      ACCOUNT_REPLY_POLLER_ENABLED: "true"
      ACCOUNT_REPLY_LEGACY_POLLER_ENABLED: "true"
      ACCOUNT_DEFAULT_PROCESSING_PROFILE: production
      ACCOUNT_SLACK_N8N_WEBHOOK_URL: ${PRODUCTION_ACCOUNT_SLACK_N8N_WEBHOOK_URL:-}
      ACCOUNT_SLACK_N8N_STATUS_URL: ${PRODUCTION_ACCOUNT_SLACK_N8N_STATUS_URL:-}
      ENGINEER_SLACK_ACCESS_TOKEN: ${PRODUCTION_ENGINEER_SLACK_ACCESS_TOKEN:-}
      ENGINEER_SLACK_TEAM_ID: ${PRODUCTION_ENGINEER_SLACK_TEAM_ID:-}
      ENGINEER_SLACK_CHANNEL_ID: ${PRODUCTION_ENGINEER_SLACK_CHANNEL_ID:-}
      n8n_request_token: ${n8n_request_token:-}
      ACCOUNT_SLACK_N8N_TIMEOUT_SECONDS: ${PRODUCTION_ACCOUNT_SLACK_N8N_TIMEOUT_SECONDS:-15}
      ENGINEER_SLACK_TIMEOUT_SECONDS: ${PRODUCTION_ENGINEER_SLACK_TIMEOUT_SECONDS:-15}
      WORKER_CONCURRENCY: ${WORKER_AUX_CONCURRENCY:-1}
      ENGINEER_ASSIGNMENT_POLLER_ENABLED: "false"
      AUTOMATION_PERSONA_MODEL: ${AUTOMATION_PERSONA_MODEL:-gpt-5.6-luna}
      AUTOMATION_PERSONA_REASONING_EFFORT: ${AUTOMATION_PERSONA_REASONING_EFFORT:-low}
      AUTOMATION_PERSONA_TEMPERATURE: ${AUTOMATION_PERSONA_TEMPERATURE:-0.4}
      AUTOMATION_PERSONA_TIMEOUT_SECONDS: ${AUTOMATION_PERSONA_TIMEOUT_SECONDS:-30}
      AUTOMATION_PERSONA_MAX_RETRIES: ${AUTOMATION_PERSONA_MAX_RETRIES:-1}
      ENABLEMENT_COMPLETION_CLASSIFIER_ENABLED: ${ENABLEMENT_COMPLETION_CLASSIFIER_ENABLED:-true}
      ENABLEMENT_COMPLETION_CLASSIFIER_MODEL: ${ENABLEMENT_COMPLETION_CLASSIFIER_MODEL:-gpt-5.6-luna}
      ENABLEMENT_COMPLETION_CLASSIFIER_REASONING_EFFORT: ${ENABLEMENT_COMPLETION_CLASSIFIER_REASONING_EFFORT:-low}
      ENABLEMENT_COMPLETION_CLASSIFIER_TEMPERATURE: ${ENABLEMENT_COMPLETION_CLASSIFIER_TEMPERATURE:-0.0}
      ENABLEMENT_COMPLETION_CLASSIFIER_TIMEOUT_SECONDS: ${ENABLEMENT_COMPLETION_CLASSIFIER_TIMEOUT_SECONDS:-20}
      ENABLEMENT_COMPLETION_CLASSIFIER_MAX_RETRIES: ${ENABLEMENT_COMPLETION_CLASSIFIER_MAX_RETRIES:-1}
      AUTOMATION_REPLY_POLL_ENABLED: ${AUTOMATION_REPLY_POLL_ENABLED:-true}
      AUTOMATION_REPLY_POLL_INTERVAL_SECONDS: ${AUTOMATION_REPLY_POLL_INTERVAL_SECONDS:-}
      AUTOMATION_REPLY_POLL_MAX_MESSAGES: ${AUTOMATION_REPLY_POLL_MAX_MESSAGES:-}
      BILLING_AUTOMATION_REPLY_POLL_ENABLED: ${BILLING_AUTOMATION_REPLY_POLL_ENABLED:-false}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag_api:8020}
      RAG_SERVICE_TIMEOUT_SECONDS: ${RAG_SERVICE_TIMEOUT_SECONDS:-45.0}
      RAG_SERVICE_SHARED_TOKEN: ${RAG_SERVICE_SHARED_TOKEN:-supportportal-rag-internal}
      SENTIMENT_PROVIDER: ${WORKER_SENTIMENT_PROVIDER:-legacy}
      SENTIMENT_MODEL_ID: ${SENTIMENT_MODEL_ID:-j-hartmann/emotion-english-distilroberta-base}
      SENTIMENT_MIN_CONFIDENCE: ${SENTIMENT_MIN_CONFIDENCE:-0.45}
    depends_on:
      redis:
        condition: service_healthy
      rag_api:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  runtime_bootstrap:
    profiles: ["bootstrap"]
    image: ${APP_RUNTIME_IMAGE:-localhost/supportportal-app:unknown}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        APP_BUILD_REF: ${APP_BUILD_REF:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    env_file:
      - ../.env
    command: ["python", "-m", "backend.scripts.runtime_bootstrap", "bootstrap"]
    environment:
      APP_BUILD_REF: ${APP_BUILD_REF:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      RUNTIME_SCHEMA_MODE: ${RUNTIME_SCHEMA_MODE:-bootstrap}
      TICKET_DB_DSN: ${TICKET_DB_DSN:?TICKET_DB_DSN is required}
      TICKET_DB_MIGRATION_DSN: ${TICKET_DB_MIGRATION_DSN:-}
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      TICKET_DB_CONNECT_TIMEOUT: ${TICKET_DB_CONNECT_TIMEOUT:-10}
      PGVECTOR_DSN: ${PGVECTOR_DSN:?PGVECTOR_DSN is required}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-supportportal}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_m3_1024}
      PGVECTOR_DIM: ${PGVECTOR_DIM:-1024}
      KNOWLEDGE_BM25_BACKFILL_ON_INIT: ${KNOWLEDGE_BM25_BACKFILL_ON_INIT:-true}
      KNOWLEDGE_BM25_BACKFILL_ON_STARTUP: ${KNOWLEDGE_BM25_BACKFILL_ON_STARTUP:-false}

volumes:
  redis_data:
  automation_redis_staging_data:
  automation_redis_preproduction_data:
  automation_redis_production_data:
  huggingface_cache:

networks:
  # podman-compose requires an explicit declaration when a service references
  # the implicit default network alongside named networks (docker-compose
  # resolves `default` automatically).
  default:
    name: deployment_default
  automation_edge:
    name: ${AUTOMATION_EDGE_NETWORK_NAME:-supportportal_automation_edge}
    external: true
  automation_internal_staging:
    name: ${AUTOMATION_STAGING_INTERNAL_NETWORK_NAME:-supportportal_automation_internal_staging}
    external: true
  automation_internal_preproduction:
    name: ${AUTOMATION_PREPRODUCTION_INTERNAL_NETWORK_NAME:-supportportal_automation_internal_preproduction}
    external: true
  automation_internal_production:
    name: ${AUTOMATION_PRODUCTION_INTERNAL_NETWORK_NAME:-supportportal_automation_internal_production}
    external: true
