services:
  api:
    build:
      args:
        INSTALL_ML_DEPS: "0"
    environment:
      RUNTIME_PROFILE: local_lightweight
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTE_TIMEOUT_SECONDS: ${ACCOUNT_ROUTE_TIMEOUT_SECONDS:-120}
      SENTIMENT_PROVIDER: legacy

  rag_api:
    environment:
      RUNTIME_PROFILE: local_lightweight
      RAG_KG_AUXILIARY_ENABLED: ${RAG_KG_AUXILIARY_ENABLED:-true}
      KG_NEO4J_URI: ${KG_NEO4J_URI:-bolt://local_neo4j:7687}
      KG_NEO4J_USER: ${KG_NEO4J_USER:-neo4j}
      KG_NEO4J_PASSWORD: ${KG_NEO4J_PASSWORD:-supportportal-kg-local}
      KG_LLM_API_KEY: ${KG_LLM_API_KEY:-}
      KG_LLM_BASE_URL: ${KG_LLM_BASE_URL:-}
      KG_LLM_MODEL: ${KG_LLM_MODEL:-}
      KG_EMBEDDING_API_KEY: ${KG_EMBEDDING_API_KEY:-}
      KG_EMBEDDING_MODEL: ${KG_EMBEDDING_MODEL:-}
      KG_EMBEDDING_BASE_URL: ${KG_EMBEDDING_BASE_URL:-}
      KG_EMBEDDING_DIM: ${KG_EMBEDDING_DIM:-}
    depends_on:
      local_neo4j:
        condition: service_healthy

  rag_worker:
    environment:
      RUNTIME_PROFILE: local_lightweight
      RAG_KG_AUXILIARY_ENABLED: ${RAG_KG_AUXILIARY_ENABLED:-true}
      KG_NEO4J_URI: ${KG_NEO4J_URI:-bolt://local_neo4j:7687}
      KG_NEO4J_USER: ${KG_NEO4J_USER:-neo4j}
      KG_NEO4J_PASSWORD: ${KG_NEO4J_PASSWORD:-supportportal-kg-local}
      KG_LLM_API_KEY: ${KG_LLM_API_KEY:-}
      KG_LLM_BASE_URL: ${KG_LLM_BASE_URL:-}
      KG_LLM_MODEL: ${KG_LLM_MODEL:-}
      KG_EMBEDDING_API_KEY: ${KG_EMBEDDING_API_KEY:-}
      KG_EMBEDDING_MODEL: ${KG_EMBEDDING_MODEL:-}
      KG_EMBEDDING_BASE_URL: ${KG_EMBEDDING_BASE_URL:-}
      KG_EMBEDDING_DIM: ${KG_EMBEDDING_DIM:-}
    depends_on:
      local_neo4j:
        condition: service_healthy

  ws_gateway:
    environment:
      RUNTIME_PROFILE: local_lightweight

  worker_query:
    environment:
      RUNTIME_PROFILE: local_lightweight
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTE_TIMEOUT_SECONDS: ${ACCOUNT_ROUTE_TIMEOUT_SECONDS:-120}
      SENTIMENT_PROVIDER: legacy

  worker_aux:
    environment:
      RUNTIME_PROFILE: local_lightweight
      # Reply job statuses are version-fenced, so this worker may poll a shared
      # PostgreSQL database without an older worker claiming new v8 jobs.
      ACCOUNT_REPLY_POLLER_ENABLED: "true"
      ACCOUNT_REPLY_LEGACY_POLLER_ENABLED: "true"
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTE_TIMEOUT_SECONDS: ${ACCOUNT_ROUTE_TIMEOUT_SECONDS:-120}
      SENTIMENT_PROVIDER: legacy

  local_neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${LOCAL_NEO4J_AUTH:-neo4j/supportportal-kg-local}
      NEO4J_server_memory_heap_initial__size: ${LOCAL_NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${LOCAL_NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${LOCAL_NEO4J_PAGECACHE:-256m}
      NEO4J_server_http_enabled: "false"
    ports:
      - "${LOCAL_NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - supportportal_local_neo4j_data:/data
      - supportportal_local_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p supportportal-kg-local 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  supportportal_local_neo4j_data:
  supportportal_local_neo4j_logs:
