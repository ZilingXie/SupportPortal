map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream support_api {
    server api:8000;
    keepalive 64;
}

upstream support_ws {
    server ws_gateway:8010;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    port_in_redirect on;

    client_max_body_size 10m;

    # Docker embedded DNS; the production api container only exists when the
    # compose "production" profile is enabled, so its hostname must stay
    # unresolved at startup (variable upstream) for nginx to boot without it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $production_api api_production:8000;

    location = /client {
        return 301 /client/;
    }

    location = /engineer {
        return 301 /engineer/;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    location = /roadmap {
        return 301 /roadmap.html;
    }

    location /ws/ {
        proxy_pass http://support_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(client|engineer|dashboard|roadmap)(/.*)?$ {
        proxy_pass http://support_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location ~ ^/(account|api/account)(/.*)?$ {
        proxy_pass http://support_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /production {
        return 301 /production/;
    }

    location = /production/account {
        rewrite ^/production(/account)$ $1 break;
        proxy_pass http://$production_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The intake runs the full route/automation pipeline synchronously;
        # keep this above the UI/n8n client timeout (300s).
        proxy_read_timeout 300s;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /production/api/ {
        rewrite ^/production(/api/.*)$ $1 break;
        proxy_pass http://$production_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /production/ {
        proxy_pass http://$production_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /roadmap.html {
        proxy_pass http://support_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location / {
        proxy_pass http://support_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
