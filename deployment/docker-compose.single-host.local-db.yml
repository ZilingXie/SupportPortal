services:
  local_postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-supportportal}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-supportportal}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-supportportal}
    ports:
      - "${LOCAL_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - supportportal_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    environment: &local_app_db_environment
      TICKET_DB_DSN: postgresql://${LOCAL_POSTGRES_USER:-supportportal}:${LOCAL_POSTGRES_PASSWORD:-supportportal}@local_postgres:5432/${LOCAL_POSTGRES_DB:-supportportal}?sslmode=disable
      PGVECTOR_DSN: postgresql://${LOCAL_POSTGRES_USER:-supportportal}:${LOCAL_POSTGRES_PASSWORD:-supportportal}@local_postgres:5432/${LOCAL_POSTGRES_DB:-supportportal}?sslmode=disable
      TICKET_DB_SCHEMA: ${TICKET_DB_SCHEMA:-supportportal}
      ACCOUNT_ROUTE_MODEL: ${ACCOUNT_ROUTE_MODEL:-gpt-5.6-luna}
      ACCOUNT_ROUTE_BASE_URL: ${ACCOUNT_ROUTE_BASE_URL:-}
      ACCOUNT_ROUTE_REASONING_EFFORT: ${ACCOUNT_ROUTE_REASONING_EFFORT:-xhigh}
      ACCOUNT_ROUTE_TIMEOUT_SECONDS: ${ACCOUNT_ROUTE_TIMEOUT_SECONDS:-120}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-supportportal}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-docagent_chunks_bge_m3_1024}
      PGVECTOR_DIM: ${PGVECTOR_DIM:-1024}
      TICKET_DB_POOL_MIN_SIZE: ${LOCAL_TICKET_DB_POOL_MIN_SIZE:-1}
      TICKET_DB_POOL_MAX_SIZE: ${LOCAL_TICKET_DB_POOL_MAX_SIZE:-4}
      TICKET_DB_POOL_TIMEOUT_SECONDS: ${LOCAL_TICKET_DB_POOL_TIMEOUT_SECONDS:-15}
      PGVECTOR_CONNECT_TIMEOUT: ${LOCAL_PGVECTOR_CONNECT_TIMEOUT:-10}
      KNOWLEDGE_BM25_BACKFILL_ON_INIT: ${LOCAL_KNOWLEDGE_BM25_BACKFILL_ON_INIT:-true}
      KNOWLEDGE_BM25_BACKFILL_ON_STARTUP: ${LOCAL_KNOWLEDGE_BM25_BACKFILL_ON_STARTUP:-false}
    depends_on:
      local_postgres:
        condition: service_healthy

  rag_api:
    environment: *local_app_db_environment
    depends_on:
      local_postgres:
        condition: service_healthy

  rag_worker:
    environment: *local_app_db_environment
    depends_on:
      local_postgres:
        condition: service_healthy

  ws_gateway:
    environment: *local_app_db_environment
    depends_on:
      local_postgres:
        condition: service_healthy

  worker_query:
    environment: *local_app_db_environment
    depends_on:
      local_postgres:
        condition: service_healthy

  worker_aux:
    environment:
      <<: *local_app_db_environment
      ACCOUNT_REPLY_POLLER_ENABLED: "true"
      ACCOUNT_REPLY_LEGACY_POLLER_ENABLED: "true"
    depends_on:
      local_postgres:
        condition: service_healthy

volumes:
  supportportal_local_pgdata:
